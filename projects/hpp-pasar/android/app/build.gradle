plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ardac.hpppasar'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ardac.hpppasar'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.1.3'
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
}
