name: MOSHI Alpha.6 AAB Export

on:
  push:
    branches: [fix/moshi-compose-scope-alpha]
    paths:
      - '.github/workflows/moshi-alpha6-aab-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build unsigned Alpha.6 AAB
        working-directory: projects/moshi/android
        run: gradle :app:bundleRelease -x lintVitalRelease -x lintVitalAnalyzeRelease --stacktrace -PMOSHI_API_BASE_URL="https://america-assignments-donors-seo.trycloudflare.com"
      - name: Stage AAB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          AAB="projects/moshi/android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          cp "$AAB" dist/MOSHI-alpha6-unsigned.aab
          sha256sum dist/MOSHI-alpha6-unsigned.aab > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MOSHI-alpha6-aab-export
          path: dist/
          retention-days: 7
