name: BBYA Underground Buffer Next

on:
  push:
    branches: [main]
    paths:
      - '.bbya-underground-buffer-trigger'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  buffer_and_dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_REPO: ardarawk-cloud/ACC-Roblox-maps
      SOURCE_TOKEN: ${{ secrets.ACC_ROBLOX_MAPS_WRITE_TOKEN || secrets.ACC_ROBLOX_MAPS_READ_TOKEN }}
    steps:
      - name: Checkout cadangan control repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout BBYA Source of Truth
        uses: actions/checkout@v4
        with:
          repository: ardarawk-cloud/ACC-Roblox-maps
          ref: main
          token: ${{ env.SOURCE_TOKEN }}
          path: source
          fetch-depth: 0

      - name: Buffer next nine unique Underground Drive tracks
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git config user.name 'BBYA Underground Buffer'
          git config user.email 'actions@users.noreply.github.com'
          python3 scripts/bbya-underground-buffer-next.py
          git add maps/bbya-social-hub/audio-playlists/underground.json
          if ! git diff --cached --quiet; then
            git commit -m 'Buffer next Underground Drive tracks [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Dispatch serial Underground batch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o "$RUNNER_TEMP/dispatch.txt" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/bbya-underground-audio-cadangan-01.yml/dispatches" \
            -d '{"ref":"main"}')
          [[ "$code" == '204' ]] || { cat "$RUNNER_TEMP/dispatch.txt"; echo "DISPATCH_HTTP_$code"; exit 20; }
          echo UNDERGROUND_BATCH_DISPATCHED
