name: After School City V04 Hosted QC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/after-school-city-v04-qc-hosted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_REPO: ardarawk-cloud/ACC-Roblox-maps
      SOURCE_SHA: 9a2ad543a1b5667a6bc6a0cfaf0aa716fbbe187e

    steps:
      - name: Checkout publisher repository
        uses: actions/checkout@v4

      - name: Checkout locked ASC v0.4 source
        uses: actions/checkout@v4
        with:
          repository: ardarawk-cloud/ACC-Roblox-maps
          ref: 9a2ad543a1b5667a6bc6a0cfaf0aa716fbbe187e
          token: ${{ secrets.ACC_ROBLOX_MAPS_WRITE_TOKEN }}
          path: asc-source
          fetch-depth: 1

      - name: Static source lock
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git -C asc-source rev-parse HEAD)
          [[ "$actual" == "$SOURCE_SHA" ]]
          project='asc-source/maps/after-school-city/default.project.json'
          config='asc-source/maps/after-school-city/after-school-city.config.lua'
          street='asc-source/maps/after-school-city/after-school-city.street-life.server.lua'
          jq -e . "$project" >/dev/null
          grep -Fq '0.4.0-street-density-pass-1' "$config"
          grep -Fq 'EnableStreetDensityPass = true' "$config"
          grep -Fq 'ASC_StreetLife' "$project"
          grep -Fq 'after-school-city.street-life.server.lua' "$project"
          grep -Fq 'V04_StreetLife' "$street"
          grep -Fq 'SecondaryStreetGrid' "$street"
          grep -Fq 'StudentRowInfill' "$street"
          grep -Fq 'V04_DowntownBackAlley' "$street"
          grep -Fq 'ParkingAndVehicles' "$street"
          grep -Fq 'SchoolBusParked' "$street"
          if grep -Eq 'MarketplaceService|PromptProductPurchase|ProcessReceipt|DataStoreService|BillboardGui' "$street"; then
            echo 'Forbidden authority/debug marker found in v0.4 street layer'
            exit 12
          fi
          echo "ASC V0.4 STATIC LOCK PASS source=$actual"

      - name: Prepare Rojo 7.7.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc-rojo"
          curl -fsSL 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip' -o "$RUNNER_TEMP/rojo.zip"
          unzip -q -o "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/asc-rojo"
          rojo=$(find "$RUNNER_TEMP/asc-rojo" -type f -name rojo | head -n1)
          [[ -n "$rojo" ]]
          chmod +x "$rojo"
          "$rojo" --version
          echo "ROJO_EXE=$rojo" >> "$GITHUB_ENV"

      - name: Build exact ASC v0.4 place
        shell: bash
        run: |
          set -euo pipefail
          place="$RUNNER_TEMP/after-school-city-v04.rbxl"
          "$ROJO_EXE" build 'asc-source/maps/after-school-city/default.project.json' -o "$place"
          test -f "$place"
          bytes=$(stat -c%s "$place")
          (( bytes >= 1024 ))
          sha=$(sha256sum "$place" | awk '{print $1}')
          echo "ASC V0.4 ROJO BUILD PASS bytes=$bytes sha256=$sha"
