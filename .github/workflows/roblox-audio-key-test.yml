name: Roblox Cadangan Audio Key Test

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  test-key:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'ROBLOX AUDIO KEY TEST')
    runs-on: ubuntu-latest
    env:
      AUDIO_KEY: ${{ secrets.ROBLOX_PUBLISH_CADANGAN_AUDIO_01 }}
    steps:
      - name: Check key availability and audio scopes
        id: keycheck
        shell: bash
        run: |
          set +e
          if [ -z "$AUDIO_KEY" ]; then
            result="SECRET_MISSING"
          else
            tmp=$(mktemp)
            code=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST 'https://apis.roblox.com/api-keys/v1/introspect' \
              -H 'Content-Type: application/json' \
              --data "{\"apiKey\":\"$AUDIO_KEY\"}")
            if [ "$code" != "200" ]; then
              result="INTROSPECT_HTTP_$code"
            else
              response=$(cat "$tmp")
              result=$(python3 - "$response" <<'PY'
          import json,sys
          try:
              d=json.loads(sys.argv[1])
              scopes=d.get('scopes') or []
              asset=any(s.get('name')=='asset' and {'read','write'}.issubset(set(s.get('operations') or [])) for s in scopes)
              perm=any(s.get('name')=='asset-permissions:write' or (s.get('name')=='asset-permissions' and 'write' in (s.get('operations') or [])) for s in scopes)
              if d.get('expired') is True:
                  print('KEY_EXPIRED')
              elif d.get('enabled') is False:
                  print('KEY_DISABLED')
              elif not asset:
                  print('MISSING_ASSET_RW_SCOPE')
              elif not perm:
                  print('MISSING_ASSET_PERMISSION_SCOPE')
              else:
                  print('PASS_AUDIO_KEY')
          except Exception:
              print('INVALID_INTROSPECT_RESPONSE')
          PY
          )
            fi
            rm -f "$tmp"
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "$result"

      - name: Comment result on test issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.keycheck.outputs.result }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$RESULT"
