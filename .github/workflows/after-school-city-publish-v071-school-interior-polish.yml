# Owner-approved AFTER SCHOOL CITY School Interior Polish v0.7.1 LIVE publish
name: After School City Publish School Interior Polish V0.7.1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/after-school-city-publish-v071-school-interior-polish.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: after-school-city-live-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REPO: ardarawk-cloud/ACC-Roblox-maps
      SOURCE_SHA: 817ed8e29b96327f3f9ba48526908b5b4260437c
      BASE_LIVE_SHA: dcaa53170892974af7704423cb4fdc9e2ee25a1f
      QC_RUN_ID: '33188367992'
      UNIVERSE_ID: '10745359869'
      PLACE_ID: '121603385909425'
      EXPECTED_BYTES: '80467'
      EXPECTED_SHA256: 'd2fa708a5b43aa54adeab59c17fc866203345cdd6aa60ab9ee7e872fcde7deff'
      ROBLOX_API_KEY: ${{ secrets.ROCKET_RACOON_PUBLISH }}
    steps:
      - name: Checkout publisher repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical V0.7.1 QC receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt='deploy-status/after-school-city-v071-polish-qc.json'
          test -f "$receipt"
          [[ "$(jq -r '.status' "$receipt")" == 'QC_PASS' ]] || { echo 'Canonical QC is not PASS'; exit 9; }
          [[ "$(jq -r '.sourceCommit' "$receipt")" == "$SOURCE_SHA" ]] || { echo 'QC source mismatch'; exit 10; }
          [[ "$(jq -r '.baseLiveCommit' "$receipt")" == "$BASE_LIVE_SHA" ]] || { echo 'QC base LIVE mismatch'; exit 11; }
          [[ "$(jq -r '.runId' "$receipt")" == "$QC_RUN_ID" ]] || { echo 'QC run mismatch'; exit 12; }
          [[ "$(jq -r '.placeBytes' "$receipt")" == "$EXPECTED_BYTES" ]] || { echo 'QC byte mismatch'; exit 13; }
          [[ "$(jq -r '.placeSha256' "$receipt")" == "$EXPECTED_SHA256" ]] || { echo 'QC SHA mismatch'; exit 14; }
          echo "QC AUTHORITY PASS run=$QC_RUN_ID source=$SOURCE_SHA"

      - name: Checkout locked After School City source
        uses: actions/checkout@v4
        with:
          repository: ardarawk-cloud/ACC-Roblox-maps
          ref: 817ed8e29b96327f3f9ba48526908b5b4260437c
          token: ${{ secrets.ACC_ROBLOX_MAPS_WRITE_TOKEN }}
          path: asc-source
          fetch-depth: 0

      - name: Verify exact V0.7.1 source and narrow delta
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ROBLOX_API_KEY:-}" ]] || { echo 'ROCKET_RACOON_PUBLISH missing'; exit 20; }
          actual=$(git -C asc-source rev-parse HEAD)
          [[ "$actual" == "$SOURCE_SHA" ]] || { echo "Source SHA mismatch: $actual"; exit 21; }
          git -C asc-source cat-file -e "${BASE_LIVE_SHA}^{commit}"
          mapfile -t files < <(git -C asc-source diff --name-only "$BASE_LIVE_SHA" "$SOURCE_SHA")
          [[ ${#files[@]} -eq 3 ]] || { printf '%s\n' "${files[@]}"; echo "Unexpected delta count ${#files[@]}"; exit 22; }
          expected=(
            'maps/after-school-city/after-school-city.config.lua'
            'maps/after-school-city/after-school-city.school-interior-polish.server.lua'
            'maps/after-school-city/default.project.json'
          )
          for f in "${expected[@]}"; do printf '%s\n' "${files[@]}" | grep -Fxq "$f" || { echo "Missing expected delta $f"; exit 23; }; done
          echo "SOURCE LOCK PASS source=$actual delta=3-files"

      - name: Verify V0.7 baseline preservation
        shell: pwsh
        working-directory: asc-source
        run: |
          $ErrorActionPreference='Stop'
          $config='maps/after-school-city/after-school-city.config.lua'
          $original=[System.IO.File]::ReadAllBytes($config)
          $before=(Get-FileHash $config -Algorithm SHA256).Hash
          try {
            $text=[System.Text.Encoding]::UTF8.GetString($original)
            $text=$text.Replace('Version = "0.7.1-school-interior-polish-1"','Version = "0.7.0-school-interior-1"')
            [System.IO.File]::WriteAllText($config,$text,(New-Object System.Text.UTF8Encoding($false)))
            & '.github/scripts/after-school-city-school-interior-audit.ps1'
          }
          finally {
            [System.IO.File]::WriteAllBytes($config,$original)
          }
          $after=(Get-FileHash $config -Algorithm SHA256).Hash
          if($after -ne $before){throw "Config restore hash mismatch: before=$before after=$after"}
          Write-Host "V0.7 BASELINE PASS configHash=$after"

      - name: Audit V0.7.1 polish contract
        shell: pwsh
        working-directory: asc-source
        run: |
          $ErrorActionPreference='Stop'
          $map='maps/after-school-city'
          $polish=Get-Content "$map/after-school-city.school-interior-polish.server.lua" -Raw
          $config=Get-Content "$map/after-school-city.config.lua" -Raw
          $project=Get-Content "$map/default.project.json" -Raw
          $null=$project|ConvertFrom-Json
          function Need([string]$text,[string]$token,[string]$label){if($text.IndexOf($token,[StringComparison]::Ordinal)-lt 0){throw "V0.7.1 missing contract: $label"}}
          foreach($token in @(
            'V071_SchoolInteriorPolish',
            '0.7.1-school-interior-polish-1',
            'ASC_SchoolInteriorPass',
            'ASC_StreetLightGeometryFixed',
            'Vector3.new(11, 0.65, 0.65)',
            'AFTER SCHOOL ACADEMY',
            'AFTER SCHOOL SKATE',
            'WELCOME / MAIN HALL',
            'MAIN HALL',
            'LIBRARY',
            'CANTEEN',
            'TEACHER / ADMIN',
            'obj.Name .. "Support"',
            'LibraryShelfBand',
            'ASC_SchoolInteriorPolishPass'
          )){Need $polish $token $token}
          foreach($forbidden in @('MarketplaceService','PromptProductPurchase','ProcessReceipt','DataStoreService','BillboardGui','NorthSouthRoad')){
            if($polish -match [regex]::Escape($forbidden)){throw "Forbidden V0.7.1 scope token: $forbidden"}
          }
          $m=[regex]::Match($polish,'MAX_POLISH_PARTS\s*=\s*(\d+)')
          if(-not $m.Success){throw 'MAX_POLISH_PARTS missing'}
          $budget=[int]$m.Groups[1].Value
          if($budget -gt 90){throw "Polish part budget too high: $budget"}
          foreach($token in @(
            'Version = "0.7.1-school-interior-polish-1"',
            'SchoolInteriorVersion = "0.7.0-school-interior-1"',
            'SchoolInteriorPolishVersion = "0.7.1-school-interior-polish-1"',
            'EnableSchoolInteriorPass = true',
            'EnableSchoolInteriorPolishPass = true',
            'EnableActivities = false',
            'EnableEconomy = false',
            'EnablePersistence = false',
            'EnablePersonalRoom = false',
            'EnableClubs = false'
          )){Need $config $token $token}
          Need $project 'ASC_SchoolInteriorPolish' 'Rojo polish node'
          Need $project 'after-school-city.school-interior-polish.server.lua' 'Rojo polish source'
          Write-Host "V0.7.1 POLISH AUDIT PASS budget=$budget gameplayAuthority=OFF"

      - name: Verify dedication and protected source unchanged
        shell: bash
        working-directory: asc-source
        run: |
          set -euo pipefail
          for f in \
            maps/after-school-city/after-school-city.intro.client.lua \
            maps/after-school-city/after-school-city.orientation-correction.server.lua \
            maps/after-school-city/after-school-city.road-centerline-clearance.server.lua \
            maps/after-school-city/after-school-city.premium-exterior.server.lua \
            maps/after-school-city/after-school-city.school-interior.server.lua; do
            git diff --quiet "$BASE_LIVE_SHA" "$SOURCE_SHA" -- "$f" || { echo "Protected source changed: $f"; exit 30; }
          done
          grep -Fq 'PUTU AZYA PUTRI' maps/after-school-city/after-school-city.intro.client.lua
          grep -Fq 'BINTANG HARDAJAYA' maps/after-school-city/after-school-city.intro.client.lua
          grep -Fq 'WITH LOVE, DAD' maps/after-school-city/after-school-city.intro.client.lua
          grep -Fq 'ENTER THE CITY' maps/after-school-city/after-school-city.intro.client.lua
          echo 'PROTECTED SOURCE PASS dedication=UNCHANGED road=UNCHANGED orientation=UNCHANGED V0.7=UNCHANGED'

      - name: Prepare Rojo 7.7.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc-rojo"
          curl -fsSL 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip' -o "$RUNNER_TEMP/rojo.zip"
          unzip -q -o "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/asc-rojo"
          rojo=$(find "$RUNNER_TEMP/asc-rojo" -type f -name rojo | head -n1)
          [[ -n "$rojo" ]] || exit 40
          chmod +x "$rojo"
          version=$("$rojo" --version)
          [[ "$version" == *'7.7.0'* ]] || { echo "Wrong Rojo: $version"; exit 41; }
          echo "ROJO_EXE=$rojo" >> "$GITHUB_ENV"

      - name: Build and verify exact V0.7.1 place
        shell: bash
        run: |
          set -euo pipefail
          place="$RUNNER_TEMP/after-school-city-v071.rbxl"
          "$ROJO_EXE" build 'asc-source/maps/after-school-city/default.project.json' -o "$place"
          test -f "$place"
          bytes=$(stat -c%s "$place")
          sha=$(sha256sum "$place" | awk '{print $1}')
          [[ "$bytes" == "$EXPECTED_BYTES" ]] || { echo "Byte mismatch: $bytes expected=$EXPECTED_BYTES"; exit 42; }
          [[ "$sha" == "$EXPECTED_SHA256" ]] || { echo "SHA256 mismatch: $sha expected=$EXPECTED_SHA256"; exit 43; }
          echo "PLACE_FILE=$place" >> "$GITHUB_ENV"
          echo "PLACE_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "PLACE_SHA256=$sha" >> "$GITHUB_ENV"
          echo "BUILD EXACT PASS bytes=$bytes sha256=$sha"

      - name: Publish School Interior Polish v0.7.1 LIVE to Roblox
        shell: bash
        run: |
          set -euo pipefail
          url="https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published"
          http=$(curl -sS --location -o "$RUNNER_TEMP/asc-publish-response.json" -w '%{http_code}' -X POST "$url" -H "x-api-key: $ROBLOX_API_KEY" -H 'Content-Type: application/octet-stream' --data-binary "@$PLACE_FILE")
          body=$(cat "$RUNNER_TEMP/asc-publish-response.json")
          [[ "$http" =~ ^2[0-9][0-9]$ ]] || { echo "HTTP $http: $body"; exit 50; }
          version=$(jq -r '.versionNumber // empty' "$RUNNER_TEMP/asc-publish-response.json")
          [[ -n "$version" ]] || { echo "Missing versionNumber: $body"; exit 51; }
          echo "PUBLISHED_VERSION=$version" >> "$GITHUB_ENV"
          echo "ROBLOX PUBLISH PASS version=$version"

      - name: Persist LIVE receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          jq -n \
            --arg status 'LIVE_PUBLISHED' \
            --arg project 'AFTER SCHOOL CITY' \
            --arg mode 'SCHOOL_INTERIOR_POLISH_V0_7_1' \
            --arg sourceRepo "$SOURCE_REPO" \
            --arg sourceCommit "$SOURCE_SHA" \
            --arg baseLiveCommit "$BASE_LIVE_SHA" \
            --arg qcRunId "$QC_RUN_ID" \
            --arg universeId "$UNIVERSE_ID" \
            --arg placeId "$PLACE_ID" \
            --arg versionNumber "$PUBLISHED_VERSION" \
            --arg rojoVersion '7.7.0' \
            --arg placeBytes "$PLACE_BYTES" \
            --arg placeSha256 "$PLACE_SHA256" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,project:$project,mode:$mode,sourceRepo:$sourceRepo,sourceCommit:$sourceCommit,baseLiveCommit:$baseLiveCommit,qcRunId:$qcRunId,universeId:$universeId,placeId:$placeId,versionNumber:($versionNumber|tonumber),rojoVersion:$rojoVersion,placeBytes:($placeBytes|tonumber),placeSha256:$placeSha256,runId:$runId,publishedAt:$publishedAt,note:"School Interior Polish v0.7.1 exact QC-locked source; floating street-light geometry cleanup, signage/furniture polish; protected road/orientation/V0.7/dedication source unchanged."}' \
            > deploy-status/after-school-city-publish-school-interior-polish-v0-7-1.json
          cat deploy-status/after-school-city-publish-school-interior-polish-v0-7-1.json
          git config user.name 'After School City Publish Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/after-school-city-publish-school-interior-polish-v0-7-1.json
          git commit -m "Record After School City V0.7.1 polish publish v${PUBLISHED_VERSION} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
