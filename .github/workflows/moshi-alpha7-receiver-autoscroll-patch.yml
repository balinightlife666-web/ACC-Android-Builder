name: MOSHI Alpha 7 Receiver Autoscroll Patch

on:
  push:
    branches:
      - fix/moshi-compose-scope-alpha
    paths:
      - .github/workflows/moshi-alpha7-receiver-autoscroll-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/moshi-compose-scope-alpha
      - name: Apply Alpha 7 patch
        run: python .github/scripts/moshi_alpha7_receiver_autoscroll.py
      - name: Commit patch
        run: |
          git config user.name ardarawk-cloud
          git config user.email ardarawk@gmail.com
          git add projects/moshi/android/app/src/main/java/com/ardacore/moshi/ChatUi.kt projects/moshi/android/app/build.gradle.kts
          git diff --cached --check
          git commit -m "Fix MOSHI receiver realtime autoscroll"
          git push origin HEAD:fix/moshi-compose-scope-alpha
