name: Apply MOSHI Compose Scope Hotfix

on:
  push:
    branches: [fix/moshi-compose-scope-alpha]
    paths:
      - '.github/workflows/moshi-alpha-hotfix-apply.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/moshi-compose-scope-alpha

      - name: Apply narrow MOSHI runtime patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          controller_path = Path('projects/moshi/android/app/src/main/java/com/ardacore/moshi/chat/ChatController.kt')
          text = controller_path.read_text()

          text = text.replace(
              'import kotlinx.coroutines.CoroutineScope\n',
              'import kotlinx.coroutines.CancellationException\nimport kotlinx.coroutines.CoroutineScope\n',
              1,
          )

          old_start = '''    suspend fun startDirect(user: ChatUser) {
        val conversation = runBusyResult { api.createDirect(session.accessToken, user.username) } ?: return
        activeConversation = conversation
        groupMembers = emptyList()
        searchResults = emptyList()
        local.cacheConversations(listOf(conversation) + conversations.filterNot { it.id == conversation.id })
        runBusy {
            loadConversationMessages(conversation)
            retryOutboxInternal()
            syncConversations()
        }
    }
'''
          new_start = '''    fun startDirect(user: ChatUser) {
        scope.launch { startDirectInternal(user) }
    }

    private suspend fun startDirectInternal(user: ChatUser) {
        val conversation = runBusyResult { api.createDirect(session.accessToken, user.username) } ?: return
        activeConversation = conversation
        groupMembers = emptyList()
        searchResults = emptyList()
        local.cacheConversations(listOf(conversation) + conversations.filterNot { it.id == conversation.id })
        runBusy {
            loadConversationMessages(conversation)
            retryOutboxInternal()
            syncConversations()
        }
    }
'''
          if old_start not in text:
              raise SystemExit('startDirect block not found')
          text = text.replace(old_start, new_start, 1)

          old_open = '''    suspend fun openConversation(conversation: ChatConversation) {
        activeConversation = conversation
        messages = local.messages(conversation.id)
        groupMembers = emptyList()
        runBusy {
            if (conversation.kind == "group") loadGroupMembersInternal(conversation)
            loadConversationMessages(conversation)
            retryOutboxInternal()
            syncConversations()
        }
    }
'''
          new_open = '''    fun openConversation(conversation: ChatConversation) {
        scope.launch { openConversationInternal(conversation) }
    }

    private suspend fun openConversationInternal(conversation: ChatConversation) {
        activeConversation = conversation
        messages = local.messages(conversation.id)
        groupMembers = emptyList()
        runBusy {
            if (conversation.kind == "group") loadGroupMembersInternal(conversation)
            loadConversationMessages(conversation)
            retryOutboxInternal()
            syncConversations()
        }
    }
'''
          if old_open not in text:
              raise SystemExit('openConversation block not found')
          text = text.replace(old_open, new_open, 1)

          old_run_busy = '''        try {
            block()
        } catch (t: Throwable) {
            error = t.message ?: "MOSHI chat request failed"
        } finally {
            busy = false
        }
'''
          new_run_busy = '''        try {
            block()
        } catch (cancellation: CancellationException) {
            throw cancellation
        } catch (t: Throwable) {
            error = t.message ?: "MOSHI chat request failed"
        } finally {
            busy = false
        }
'''
          if old_run_busy not in text:
              raise SystemExit('runBusy block not found')
          text = text.replace(old_run_busy, new_run_busy, 1)

          old_run_result = '''        return try {
            block()
        } catch (t: Throwable) {
            error = t.message ?: "MOSHI chat request failed"
            null
        } finally {
            busy = false
        }
'''
          new_run_result = '''        return try {
            block()
        } catch (cancellation: CancellationException) {
            throw cancellation
        } catch (t: Throwable) {
            error = t.message ?: "MOSHI chat request failed"
            null
        } finally {
            busy = false
        }
'''
          if old_run_result not in text:
              raise SystemExit('runBusyResult block not found')
          text = text.replace(old_run_result, new_run_result, 1)

          controller_path.write_text(text)

          gradle_path = Path('projects/moshi/android/app/build.gradle.kts')
          gradle = gradle_path.read_text()
          if 'versionCode = 3' not in gradle or 'versionName = "0.4.0-alpha.1"' not in gradle:
              raise SystemExit('Unexpected MOSHI alpha version')
          gradle = gradle.replace('versionCode = 3', 'versionCode = 4', 1)
          gradle = gradle.replace('versionName = "0.4.0-alpha.1"', 'versionName = "0.4.0-alpha.2"', 1)
          gradle_path.write_text(gradle)
          PY

          git rm .github/workflows/moshi-alpha-hotfix-apply.yml
          git diff --check
          git diff -- projects/moshi/android/app/src/main/java/com/ardacore/moshi/chat/ChatController.kt projects/moshi/android/app/build.gradle.kts

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'ardarawk-cloud'
          git config user.email 'ardarawk@gmail.com'
          git add projects/moshi/android/app/src/main/java/com/ardacore/moshi/chat/ChatController.kt projects/moshi/android/app/build.gradle.kts
          git commit -m 'Fix MOSHI conversation scope cancellation'
          git push origin HEAD:fix/moshi-compose-scope-alpha
