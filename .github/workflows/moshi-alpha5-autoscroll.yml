name: MOSHI Alpha.5 Autoscroll Patch

on:
  push:
    branches: [fix/moshi-compose-scope-alpha]
    paths:
      - '.github/workflows/moshi-alpha5-autoscroll.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/moshi-compose-scope-alpha

      - name: Patch realtime chat autoscroll
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ui = Path('projects/moshi/android/app/src/main/java/com/ardacore/moshi/ChatUi.kt')
          text = ui.read_text()

          old = 'import androidx.compose.foundation.lazy.LazyColumn\nimport androidx.compose.foundation.lazy.items\n'
          new = 'import androidx.compose.foundation.lazy.LazyColumn\nimport androidx.compose.foundation.lazy.items\nimport androidx.compose.foundation.lazy.rememberLazyListState\n'
          assert old in text, 'lazy imports anchor missing'
          text = text.replace(old, new, 1)

          old = '    val conversation = controller.activeConversation ?: return\n'
          new = old + '    val messageListState = rememberLazyListState()\n'
          assert old in text, 'conversation anchor missing'
          text = text.replace(old, new, 1)

          old = '    val hasQueued = controller.messages.any { it.state == "queued" }\n'
          new = old + '''\n    val latestMessageId = controller.messages.lastOrNull()?.id\n    LaunchedEffect(conversation.id, latestMessageId) {\n        if (controller.messages.isNotEmpty()) {\n            messageListState.animateScrollToItem(controller.messages.lastIndex)\n        }\n    }\n'''
          assert old in text, 'message state anchor missing'
          text = text.replace(old, new, 1)

          old = '        LazyColumn(modifier = Modifier.weight(1f).fillMaxWidth(), verticalArrangement = Arrangement.spacedBy(8.dp)) {\n'
          new = '        LazyColumn(state = messageListState, modifier = Modifier.weight(1f).fillMaxWidth(), verticalArrangement = Arrangement.spacedBy(8.dp)) {\n'
          assert old in text, 'conversation LazyColumn anchor missing'
          text = text.replace(old, new, 1)
          ui.write_text(text)

          gradle = Path('projects/moshi/android/app/build.gradle.kts')
          build = gradle.read_text()
          assert 'versionCode = 6' in build and 'versionName = "0.4.0-alpha.4"' in build, 'unexpected current MOSHI version'
          build = build.replace('versionCode = 6', 'versionCode = 7', 1)
          build = build.replace('versionName = "0.4.0-alpha.4"', 'versionName = "0.4.0-alpha.5"', 1)
          gradle.write_text(build)
          PY

          git diff --check
          git diff -- projects/moshi/android/app/src/main/java/com/ardacore/moshi/ChatUi.kt projects/moshi/android/app/build.gradle.kts

      - name: Commit Alpha.5 source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/moshi/android/app/src/main/java/com/ardacore/moshi/ChatUi.kt projects/moshi/android/app/build.gradle.kts
          git commit -m 'Fix MOSHI chat realtime autoscroll'
          git push origin HEAD:fix/moshi-compose-scope-alpha

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build endpoint-pinned Alpha.5
        working-directory: projects/moshi/android
        run: gradle :app:assembleDebug --stacktrace -PMOSHI_API_BASE_URL='https://america-assignments-donors-seo.trycloudflare.com'

      - name: Stage APK
        shell: bash
        run: |
          mkdir -p dist
          cp projects/moshi/android/app/build/outputs/apk/debug/app-debug.apk dist/MOSHI-alpha-v0.1-alpha5.apk
          sha256sum dist/MOSHI-alpha-v0.1-alpha5.apk > dist/MOSHI-alpha-v0.1-alpha5.sha256

      - name: Upload Alpha.5
        uses: actions/upload-artifact@v4
        with:
          name: MOSHI-alpha-v0.1-alpha5-autoscroll
          path: dist/
          retention-days: 14
