name: OFFGRID Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/offgrid-phase0
    paths:
      - "apps/offgrid/**"
      - ".github/workflows/offgrid-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Build debug APK
        working-directory: apps/offgrid
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp apps/offgrid/app/build/outputs/apk/debug/app-debug.apk dist/OFFGRID-v0.0.1-phase0.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: OFFGRID-v0.0.1-phase0
          path: dist/OFFGRID-v0.0.1-phase0.apk
          if-no-files-found: error
