name: BBYA Music Normalization Control 175 V1

on:
  push:
    branches:
      - 'feat/bbya-music-manager-mvp'
    paths:
      - '.github/workflows/bbya-music-normalization-control-175-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bbya-music-normalization-control-175-v1
  cancel-in-progress: false

jobs:
  normalization-control-175:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRACK_TITLE: 'BBYA NORM CONTROL 175'
      TEST_UNIVERSE_ID: '10762005984'
      EXPECTED_AUDIO_OWNER_USER_ID: '10001957153'
      SPEED_FACTOR: '1.75'
      PLAYBACK_SPEED: '0.5714285714'
      AUDIO_KEY: ${{ secrets.AM_STUDIO_AUDIO_CADANGAN_02 }}

    steps:
      - name: Checkout development authority
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Generate copyright-clean reference audio
        id: source
        shell: bash
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/bbya-norm-control-original.wav"
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i "sine=frequency=261.625565:sample_rate=48000:duration=30" \
            -f lavfi -i "sine=frequency=329.627557:sample_rate=48000:duration=30" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=30" \
            -filter_complex "[0:a]volume=0.20[a0];[1:a]volume=0.16[a1];[2:a]volume=0.12[a2];[a0][a1][a2]amix=inputs=3:normalize=0,pan=stereo|c0=c0|c1=c0" \
            -c:a pcm_s16le "$raw"
          [[ -s "$raw" ]] || { echo CONTROL_SOURCE_MISSING; exit 20; }
          sha=$(sha256sum "$raw" | awk '{print $1}')
          duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$raw" | head -n1)
          echo "path=$raw" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "duration=$duration" >> "$GITHUB_OUTPUT"
          echo "CONTROL_SOURCE_OK sha256=$sha duration=$duration"

      - name: Apply reversible 1.75x candidate
        id: process
        env:
          RAW_PATH: ${{ steps.source.outputs.path }}
        run: |
          set -euo pipefail
          processed="$RUNNER_TEMP/bbya-norm-control-s175.mp3"
          ffmpeg -y -hide_banner -loglevel error -i "$RAW_PATH" \
            -map 0:a:0 -vn \
            -af "asetrate=48000*${SPEED_FACTOR},aresample=48000" \
            -ac 2 -codec:a libmp3lame -b:a 192k "$processed"
          [[ -s "$processed" ]] || { echo CONTROL_PROCESSED_MISSING; exit 21; }
          sha=$(sha256sum "$processed" | awk '{print $1}')
          duration=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$processed" | head -n1)
          python3 - "$SPEED_FACTOR" "$PLAYBACK_SPEED" "${{ steps.source.outputs.duration }}" "$duration" <<'PY'
          import sys
          s=float(sys.argv[1]); p=float(sys.argv[2]); original=float(sys.argv[3]); processed=float(sys.argv[4])
          if abs(p-(1/s))>1e-6: raise SystemExit('INVERSE_MATH_FAIL')
          expected=original/s
          if abs(processed-expected)>0.2: raise SystemExit(f'DURATION_FAIL expected={expected} actual={processed}')
          print(f'CONTROL_MATH_PASS original={original:.3f} processed={processed:.3f} normalized={processed/p:.3f}')
          PY
          echo "path=$processed" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "duration=$duration" >> "$GITHUB_OUTPUT"

      - name: Gate BBYA cadangan 02 uploader authority
        id: key
        run: |
          set -euo pipefail
          [[ -n "${AUDIO_KEY:-}" ]] || { echo AUDIO_KEY_MISSING; exit 30; }
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST \
            'https://apis.roblox.com/api-keys/v1/introspect' \
            -H 'Content-Type: application/json' \
            --data "{\"apiKey\":\"$AUDIO_KEY\"}")
          [[ "$code" == '200' ]] || { echo "INTROSPECT_HTTP_$code"; exit 31; }
          python3 - "$tmp" "$GITHUB_OUTPUT" <<'PY'
          import json,os,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          scopes=d.get('scopes') or []
          asset=any(s.get('name')=='asset' and {'read','write'}.issubset(set(s.get('operations') or [])) for s in scopes)
          perm=any(s.get('name')=='asset-permissions:write' or (s.get('name')=='asset-permissions' and 'write' in (s.get('operations') or [])) for s in scopes)
          uid=str(d.get('authorizedUserId') or '')
          if uid!=os.environ['EXPECTED_AUDIO_OWNER_USER_ID'] or not asset or not perm or d.get('expired') is True or d.get('enabled') is False:
              raise SystemExit(f'CADANGAN02_AUTHORITY_FAIL owner={uid}')
          with open(sys.argv[2],'a',encoding='utf-8') as f: f.write(f'authorized_user_id={uid}\n')
          print('CADANGAN02_AUTHORITY_PASS')
          PY

      - name: Upload exactly one control asset
        id: upload
        env:
          AUDIO_PATH: ${{ steps.process.outputs.path }}
          AUTHORIZED_USER_ID: ${{ steps.key.outputs.authorized_user_id }}
        run: |
          set -euo pipefail
          request=$(python3 - <<'PY'
          import json,os
          print(json.dumps({
            'assetType':'Audio',
            'displayName':os.environ['TRACK_TITLE'],
            'description':'Original BBYA technical test tones; TEST universe normalization verification only.',
            'creationContext':{'creator':{'userId':str(os.environ['AUTHORIZED_USER_ID'])}}
          },separators=(',',':')))
          PY
          )
          out="$RUNNER_TEMP/create-response.json"
          code=$(curl -sS --location -o "$out" -w '%{http_code}' \
            'https://apis.roblox.com/assets/v1/assets' \
            -H "x-api-key: $AUDIO_KEY" \
            --form-string "request=$request" \
            --form "fileContent=@${AUDIO_PATH};type=audio/mpeg")
          echo "CREATE_HTTP=$code"
          [[ "$code" -ge 200 && "$code" -lt 300 ]] || { cat "$out"; exit 40; }
          path=$(jq -r '.path // empty' "$out")
          [[ "$path" == operations/* ]] || { echo OPERATION_PATH_MISSING; cat "$out"; exit 41; }
          echo "operation_path=$path" >> "$GITHUB_OUTPUT"
          echo "UPLOAD_OPERATION=$path"

      - name: Poll operation through final Asset ID
        id: operation
        env:
          OPERATION_PATH: ${{ steps.upload.outputs.operation_path }}
        run: |
          set -euo pipefail
          op_id="${OPERATION_PATH#operations/}"
          out="$RUNNER_TEMP/operation.json"
          for attempt in $(seq 1 36); do
            code=$(curl -sS -o "$out" -w '%{http_code}' -H "x-api-key: $AUDIO_KEY" \
              "https://apis.roblox.com/assets/v1/operations/${op_id}")
            [[ "$code" -ge 200 && "$code" -lt 300 ]] || { cat "$out"; exit 50; }
            [[ "$(jq -r '.done // false' "$out")" == 'true' ]] && break
            [[ "$attempt" -lt 36 ]] || { echo OPERATION_TIMEOUT; exit 51; }
            sleep 5
          done
          python3 - "$out" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          if d.get('error'): raise SystemExit(f"ROBLOX_OPERATION_ERROR {d['error']}")
          r=d.get('response') or {}; aid=str(r.get('assetId') or '')
          if not aid: raise SystemExit('FINAL_ASSET_ID_MISSING')
          state=str((r.get('moderationResult') or {}).get('moderationState') or 'UNKNOWN')
          with open(sys.argv[2],'a',encoding='utf-8') as f: f.write(f'asset_id={aid}\ninitial_moderation={state}\n')
          print(f'FINAL_ASSET_ID={aid} moderation={state}')
          PY

      - name: Poll moderation
        id: moderation
        env:
          ASSET_ID: ${{ steps.operation.outputs.asset_id }}
          INITIAL_STATE: ${{ steps.operation.outputs.initial_moderation }}
        run: |
          set -euo pipefail
          state="$INITIAL_STATE"
          out="$RUNNER_TEMP/asset.json"
          for attempt in $(seq 1 36); do
            upper=$(printf '%s' "$state" | tr '[:lower:]' '[:upper:]')
            if [[ "$upper" == *APPROVED* || "$upper" == *REJECTED* || "$upper" == *DENIED* || "$upper" == *FAILED* ]]; then break; fi
            code=$(curl -sS -o "$out" -w '%{http_code}' -H "x-api-key: $AUDIO_KEY" \
              "https://apis.roblox.com/assets/v1/assets/${ASSET_ID}?readMask=moderationResult,state,displayName")
            if [[ "$code" == '200' ]]; then state=$(jq -r '.moderationResult.moderationState // "UNKNOWN"' "$out"); fi
            [[ "$attempt" -lt 36 ]] || break
            sleep 10
          done
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "FINAL_MODERATION_STATE=$state"

      - name: Grant use permission to Music UI TEST only
        id: permission
        if: contains(steps.moderation.outputs.state, 'Approved') || contains(steps.moderation.outputs.state, 'APPROVED')
        env:
          ASSET_ID: ${{ steps.operation.outputs.asset_id }}
        run: |
          set -euo pipefail
          payload=$(python3 - <<'PY'
          import json,os
          print(json.dumps({'subjectType':'Universe','subjectId':os.environ['TEST_UNIVERSE_ID'],'action':'Use','requests':[{'assetId':int(os.environ['ASSET_ID'])}]},separators=(',',':')))
          PY
          )
          out="$RUNNER_TEMP/permission.json"
          code=$(curl -sS -o "$out" -w '%{http_code}' -X PATCH \
            'https://apis.roblox.com/asset-permissions-api/v1/assets/permissions' \
            -H "x-api-key: $AUDIO_KEY" \
            -H 'Content-Type: application/json-patch+json' \
            --data "$payload")
          ok=false
          [[ "$code" == '200' || "$code" == '201' || "$code" == '204' ]] && ok=true
          if [[ -s "$out" ]] && jq -e --arg aid "$ASSET_ID" '.successAssetIds // [] | map(tostring) | index($aid)' "$out" >/dev/null 2>&1; then ok=true; fi
          echo "http=$code" >> "$GITHUB_OUTPUT"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "TEST_PERMISSION_HTTP=$code ok=$ok universe=$TEST_UNIVERSE_ID"
          [[ "$ok" == 'true' ]] || { cat "$out" || true; exit 60; }

      - name: Persist control receipt
        if: always() && steps.operation.outputs.asset_id != ''
        env:
          ASSET_ID: ${{ steps.operation.outputs.asset_id }}
          MODERATION: ${{ steps.moderation.outputs.state || steps.operation.outputs.initial_moderation }}
          PERMISSION_HTTP: ${{ steps.permission.outputs.http }}
          PERMISSION_OK: ${{ steps.permission.outputs.ok }}
          ORIGINAL_SHA256: ${{ steps.source.outputs.sha256 }}
          ORIGINAL_DURATION: ${{ steps.source.outputs.duration }}
          PROCESSED_SHA256: ${{ steps.process.outputs.sha256 }}
          PROCESSED_DURATION: ${{ steps.process.outputs.duration }}
          OPERATION_PATH: ${{ steps.upload.outputs.operation_path }}
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          python3 - <<'PY'
          import json,os,datetime
          state=(os.environ.get('MODERATION') or 'UNKNOWN').upper()
          permission=(os.environ.get('PERMISSION_OK') or '').lower()=='true'
          if 'APPROVED' in state and permission: status='ASSET_READY_FOR_TEST_RUNTIME'
          elif 'REJECT' in state or 'DENIED' in state or 'FAILED' in state: status='MODERATION_REJECTED'
          elif 'APPROVED' in state: status='APPROVED_PERMISSION_NOT_PROVEN'
          else: status='MODERATION_PENDING'
          receipt={
            'status':status,
            'scope':'BBYA_MUSIC_MANAGER_CONTROLLED_TEST_ONLY',
            'track':'BBYA NORM CONTROL 175',
            'source':{'kind':'generated_original_test_tones','copyrightClean':True,'sha256':os.environ['ORIGINAL_SHA256'],'durationSeconds':float(os.environ['ORIGINAL_DURATION']),'sampleRateHz':48000},
            'processing':{'authority':'EXPERIMENTAL_CANDIDATE_NOT_FINAL','speedFactor':float(os.environ['SPEED_FACTOR']),'playbackSpeed':float(os.environ['PLAYBACK_SPEED']),'method':'ffmpeg asetrate + aresample','processedSha256':os.environ['PROCESSED_SHA256'],'processedDurationSeconds':float(os.environ['PROCESSED_DURATION'])},
            'roblox':{'uploader':'AM_STUDIO_AUDIO_CADANGAN_02','operationPath':os.environ['OPERATION_PATH'],'assetId':os.environ['ASSET_ID'],'moderationState':os.environ.get('MODERATION') or 'UNKNOWN','permissionUniverseId':os.environ['TEST_UNIVERSE_ID'],'permissionHttp':os.environ.get('PERMISSION_HTTP') or None,'permissionOk':permission,'productionUniverseTargeted':False},
            'workflowRun':os.environ['GITHUB_RUN_ID'],'sourceCommit':os.environ['GITHUB_SHA'],'recordedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          open('deploy-status/bbya-music-normalization-control-175-v1.json','w',encoding='utf-8').write(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
          git config user.name 'BBYA Music Controlled Test'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/bbya-music-normalization-control-175-v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record BBYA Music 1.75x normalization control receipt [skip ci]'
            git pull --rebase origin feat/bbya-music-manager-mvp
            git push origin HEAD:feat/bbya-music-manager-mvp
          fi

      - name: Final gate
        if: always()
        run: |
          echo "assetId=${{ steps.operation.outputs.asset_id }}"
          echo "moderation=${{ steps.moderation.outputs.state || steps.operation.outputs.initial_moderation }}"
          echo "testPermission=${{ steps.permission.outputs.ok }}"
          echo "speedFactor=$SPEED_FACTOR playbackSpeed=$PLAYBACK_SPEED"
          echo 'Production universe was not targeted.'
