name: BBYA Publisher Cadangan 01

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-publisher-cadangan-01.yml'
      - '.bbya-publisher-cadangan-trigger'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bbya-publisher-cadangan-01
  cancel-in-progress: false

jobs:
  publish_if_changed:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SOURCE_REPO: ardarawk-cloud/ACC-Roblox-maps
      SOURCE_BRANCH: main
      MAP_ID: a-club

    steps:
      - name: Checkout publisher control repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve BBYA source state
        id: source
        shell: bash
        env:
          GH_READ_TOKEN: ${{ secrets.ACC_ROBLOX_MAPS_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_READ_TOKEN:-}" ]]; then
            echo 'Missing secret ACC_ROBLOX_MAPS_READ_TOKEN'
            exit 2
          fi

          api='https://api.github.com/repos/'"$SOURCE_REPO"
          auth=(-H "Authorization: Bearer $GH_READ_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          head_sha=$(curl -fsSL "${auth[@]}" "$api/commits/$SOURCE_BRANCH" | jq -r '.sha // empty')
          bbya_sha=$(curl -fsSL "${auth[@]}" "$api/commits?sha=$SOURCE_BRANCH&path=maps%2Fbbya-social-hub&per_page=1" | jq -r '.[0].sha // empty')
          if [[ -z "$head_sha" || -z "$bbya_sha" ]]; then
            echo 'Could not resolve source HEAD/BBYA commit.'
            exit 3
          fi

          last=''
          if [[ -f state/bbya-last-relevant-source.txt ]]; then
            last=$(tr -d '\r\n ' < state/bbya-last-relevant-source.txt)
          fi

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "bbya_sha=$bbya_sha" >> "$GITHUB_OUTPUT"
          if [[ "$bbya_sha" == "$last" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "No BBYA source change: $bbya_sha"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "BBYA source changed: ${last:-<none>} -> $bbya_sha"
            echo "Publishing exact main HEAD: $head_sha"
          fi

      - name: Checkout exact ACC Roblox source
        if: steps.source.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ardarawk-cloud/ACC-Roblox-maps
          ref: ${{ steps.source.outputs.head_sha }}
          token: ${{ secrets.ACC_ROBLOX_MAPS_READ_TOKEN }}
          path: source
          fetch-depth: 1

      - name: Setup Node 20
        if: steps.source.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Rojo 7.7.0
        if: steps.source.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rojo"
          curl -fsSL -o "$RUNNER_TEMP/rojo.zip" 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip'
          unzip -q -o "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/rojo"
          rojo_bin=$(find "$RUNNER_TEMP/rojo" -type f -name rojo | head -n 1)
          [[ -n "$rojo_bin" ]] || { echo 'rojo binary not found'; exit 4; }
          chmod +x "$rojo_bin"
          echo "ROJO_EXE=$rojo_bin" >> "$GITHUB_ENV"
          "$rojo_bin" --version

      - name: Full BBYA Rojo build
        if: steps.source.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bbya-cadangan-01.rbxl"
          "$ROJO_EXE" build 'source/maps/bbya-social-hub/default.project.json' -o "$out"
          [[ -s "$out" ]] || { echo 'Built place file missing'; exit 5; }
          bytes=$(wc -c < "$out")
          [[ "$bytes" -ge 1024 ]] || { echo "Built place unexpectedly small: $bytes"; exit 6; }
          echo "PLACE_FILE=$out" >> "$GITHUB_ENV"
          echo "Rojo build PASS bytes=$bytes"

      - name: Publish BBYA through Roblox Open Cloud cadangan 01
        if: steps.source.outputs.changed == 'true'
        shell: bash
        working-directory: source
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_PUBLISH_CADANGAN_01 }}
          PLACE_FILE_OVERRIDE: ${{ env.PLACE_FILE }}
          PUBLISH_RECEIPT_DIR: deploy-status-cadangan
          SOURCE_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${ROBLOX_API_KEY:-}" ]]; then
            echo 'Missing secret ROBLOX_PUBLISH_CADANGAN_01'
            exit 7
          fi
          export GITHUB_SHA="$SOURCE_SHA"
          node scripts/publish-map.js a-club

      - name: Persist receipt, checkpoint and diagnostic
        if: always()
        shell: bash
        env:
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          BBYA_SHA: ${{ steps.source.outputs.bbya_sha }}
          CHANGED: ${{ steps.source.outputs.changed }}
        run: |
          set -euo pipefail

          # On routine schedule checks with no source change, make no repository commit.
          if [[ "${CHANGED:-}" != 'true' && "$GITHUB_EVENT_NAME" != 'push' ]]; then
            echo 'No BBYA source change; no diagnostic commit required.'
            exit 0
          fi

          mkdir -p state deploy-status
          receipt='source/deploy-status-cadangan/a-club.json'
          result='FAILED_BEFORE_RECEIPT'
          if [[ -f "$receipt" ]]; then
            result='PUBLISHED'
            cp "$receipt" deploy-status/bbya-publisher-cadangan-01.json
            printf '%s\n' "$BBYA_SHA" > state/bbya-last-relevant-source.txt
            printf '%s\n' "$HEAD_SHA" > state/bbya-last-published-head.txt
          elif [[ "${CHANGED:-}" == 'false' ]]; then
            result='NO_CHANGE'
          fi

          jq -n \
            --arg status "$result" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg headSha "${HEAD_SHA:-}" \
            --arg bbyaSha "${BBYA_SHA:-}" \
            --arg changed "${CHANGED:-}" \
            --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,event:$event,runId:$runId,sourceHead:$headSha,bbyaRelevantCommit:$bbyaSha,changed:$changed,recordedAt:$at}' \
            > deploy-status/bbya-publisher-cadangan-01-status.json

          git config user.name 'BBYA Publisher Cadangan 01'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/bbya-publisher-cadangan-01-status.json
          [[ -f deploy-status/bbya-publisher-cadangan-01.json ]] && git add deploy-status/bbya-publisher-cadangan-01.json
          [[ -f state/bbya-last-relevant-source.txt ]] && git add state/bbya-last-relevant-source.txt
          [[ -f state/bbya-last-published-head.txt ]] && git add state/bbya-last-published-head.txt

          if git diff --cached --quiet; then
            echo 'No diagnostic/state changes to persist.'
            exit 0
          fi
          git commit -m "Record BBYA cadangan publisher status [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final result gate
        if: always()
        shell: bash
        env:
          CHANGED: ${{ steps.source.outputs.changed }}
        run: |
          set -euo pipefail
          if [[ "${CHANGED:-}" == 'true' && ! -f source/deploy-status-cadangan/a-club.json ]]; then
            echo 'BBYA source changed but publish receipt was not produced.'
            exit 20
          fi
          echo 'BBYA Publisher Cadangan 01 cycle complete.'
