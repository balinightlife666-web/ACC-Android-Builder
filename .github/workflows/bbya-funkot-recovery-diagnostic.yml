name: BBYA Funkot Recovery Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.bbya-funkot-recovery-diagnostic'
      - '.github/workflows/bbya-funkot-recovery-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect_without_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AUDIO_KEY: ${{ secrets.ROBLOX_PUBLISH_CADANGAN_AUDII_01 }}
      SOURCE_TOKEN: ${{ secrets.ACC_ROBLOX_MAPS_WRITE_TOKEN || secrets.ACC_ROBLOX_MAPS_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: ardarawk-cloud/ACC-Roblox-maps
          ref: main
          token: ${{ env.SOURCE_TOKEN }}
          path: source
          fetch-depth: 1

      - name: Inspect uploader and recover possible recent Track 01 asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          [[ -n "${AUDIO_KEY:-}" ]] || { echo AUDIO_KEY_MISSING; exit 2; }
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST \
            'https://apis.roblox.com/api-keys/v1/introspect' \
            -H 'Content-Type: application/json' \
            --data "{\"apiKey\":\"$AUDIO_KEY\"}")
          [[ "$code" == 200 ]] || { echo INTROSPECT_HTTP_$code; exit 3; }
          uid=$(jq -r '.authorizedUserId // empty' "$tmp")
          enabled=$(jq -r '.enabled // null' "$tmp")
          expired=$(jq -r '.expired // null' "$tmp")
          rm -f "$tmp"
          [[ -n "$uid" ]] || { echo AUTHORIZED_USER_MISSING; exit 4; }

          curl -sS "https://users.roblox.com/v1/users/$uid" -o /tmp/user.json
          uname=$(jq -r '.name // empty' /tmp/user.json)
          display=$(jq -r '.displayName // empty' /tmp/user.json)

          title=$(jq -r '.tracks[] | select(.index==1) | .title' source/maps/bbya-social-hub/audio-playlists/funkot.json)
          reg_asset=$(jq -r '.tracks[] | select(.index==1) | .assetId // empty' source/maps/bbya-social-hub/audio-playlists/funkot.json)
          reg_status=$(jq -r '.tracks[] | select(.index==1) | .status // empty' source/maps/bbya-social-hub/audio-playlists/funkot.json)

          inv_code=$(curl -sS -o /tmp/inventory.json -w '%{http_code}' \
            "https://inventory.roblox.com/v2/users/$uid/inventory/3?limit=100&sortOrder=Desc")
          cat_code=$(curl -sS -o /tmp/catalog.json -w '%{http_code}' \
            --get 'https://catalog.roblox.com/v1/search/items/details' \
            --data-urlencode 'Category=Audio' \
            --data-urlencode 'CreatorType=User' \
            --data-urlencode "CreatorTargetId=$uid" \
            --data-urlencode 'SortType=3' \
            --data-urlencode 'Limit=30')

          python3 - "$uid" "$uname" "$display" "$title" "$reg_asset" "$reg_status" "$enabled" "$expired" "$inv_code" "$cat_code" <<'PY'
          import json,sys,datetime,pathlib
          uid,uname,display,title,reg_asset,reg_status,enabled,expired,inv_code,cat_code=sys.argv[1:]
          def load(p):
              try:return json.load(open(p,encoding='utf-8'))
              except Exception:return {}
          inv=load('/tmp/inventory.json'); cat=load('/tmp/catalog.json')
          def norm(s):return ''.join(ch.lower() for ch in str(s or '') if ch.isalnum())
          target=norm(title.rsplit('.',1)[0])
          candidates=[]
          for source,data in [('inventory',inv),('catalog',cat)]:
              rows=data.get('data') if isinstance(data,dict) else None
              if not isinstance(rows,list): continue
              for x in rows:
                  name=x.get('name') or x.get('assetName') or ''
                  aid=x.get('assetId') or x.get('id')
                  n=norm(name)
                  score=0
                  if target and n==target: score=100
                  elif target and (target in n or n in target) and min(len(target),len(n))>12: score=80
                  if score:
                      candidates.append({'source':source,'assetId':str(aid) if aid is not None else None,'name':name,'score':score,'rawCreated':x.get('created') or x.get('createdAt')})
          out={
            'status':'RECOVERY_DIAGNOSTIC_ONLY_NO_UPLOAD',
            'authorizedUserId':uid,'uploaderUsername':uname,'uploaderDisplayName':display,
            'keyEnabled':enabled,'keyExpired':expired,
            'expectedUploaderUsername':'gudangpet88','uploaderMatchesExpected':uname.lower()=='gudangpet88',
            'trackIndex':1,'title':title,'registryAssetId':reg_asset or None,'registryStatus':reg_status,
            'inventoryHttp':inv_code,'catalogHttp':cat_code,'possibleMatchingAssets':candidates,
            'recordedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          pathlib.Path('deploy-status/bbya-funkot-recovery-diagnostic.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False))
          PY

      - name: Persist diagnostic receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ -f deploy-status/bbya-funkot-recovery-diagnostic.json ]] || exit 0
          git config user.name 'BBYA Funkot Recovery Diagnostic'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/bbya-funkot-recovery-diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record BBYA Funkot recovery diagnostic [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
