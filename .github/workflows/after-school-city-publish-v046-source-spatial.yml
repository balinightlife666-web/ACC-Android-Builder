# Owner-approved AFTER SCHOOL CITY Source Spatial Audit Fix v0.4.6 LIVE publish
name: After School City Publish Source Spatial V0.4.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/after-school-city-publish-v046-source-spatial.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: after-school-city-live-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_REPO: ardarawk-cloud/ACC-Roblox-maps
      SOURCE_SHA: bf45a60f57c8f0cd9735d606c25b172002d47309
      UNIVERSE_ID: '10745359869'
      PLACE_ID: '121603385909425'
      ROBLOX_API_KEY: ${{ secrets.ROCKET_RACOON_PUBLISH }}

    steps:
      - name: Checkout publisher repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout locked After School City source
        uses: actions/checkout@v4
        with:
          repository: ardarawk-cloud/ACC-Roblox-maps
          ref: bf45a60f57c8f0cd9735d606c25b172002d47309
          token: ${{ secrets.ACC_ROBLOX_MAPS_WRITE_TOKEN }}
          path: asc-source
          fetch-depth: 1

      - name: Preflight exact Source Spatial Audit Fix v0.4.6
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ROBLOX_API_KEY:-}" ]] || { echo 'ROCKET_RACOON_PUBLISH missing'; exit 10; }
          actual=$(git -C asc-source rev-parse HEAD)
          [[ "$actual" == "$SOURCE_SHA" ]] || { echo "Source SHA mismatch: $actual"; exit 11; }

          project='asc-source/maps/after-school-city/default.project.json'
          intro='asc-source/maps/after-school-city/after-school-city.intro.client.lua'
          config='asc-source/maps/after-school-city/after-school-city.config.lua'
          fix='asc-source/maps/after-school-city/after-school-city.source-spatial-fix.server.lua'

          jq -e . "$project" >/dev/null
          grep -Fq 'ASC_SourceSpatialFix' "$project"
          grep -Fq 'after-school-city.source-spatial-fix.server.lua' "$project"
          grep -Fq 'PUTU AZYA PUTRI' "$intro"
          grep -Fq 'BINTANG HARDAJAYA' "$intro"
          grep -Fq 'WITH LOVE, DAD' "$intro"
          grep -Fq 'ENTER THE CITY' "$intro"
          grep -Fq '0.4.6-source-spatial-audit-fix-1' "$config"
          grep -Fq 'EnableSourceSpatialFixPass = true' "$config"
          grep -Fq 'V046_SourceSpatialFix' "$fix"
          grep -Fq 'ASC_DowntownRoadClearanceFixed' "$fix"
          grep -Fq 'ASC_ParkPathTreeClearanceFixed' "$fix"
          grep -Fq 'ASC_BusTreeClearanceFixed' "$fix"
          echo "LOCK PASS source=$actual source_spatial_v0_4_6=PASS dedication=PASS"

      - name: Prepare Rojo 7.7.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc-rojo"
          curl -fsSL 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip' -o "$RUNNER_TEMP/rojo.zip"
          unzip -q -o "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/asc-rojo"
          rojo=$(find "$RUNNER_TEMP/asc-rojo" -type f -name rojo | head -n1)
          [[ -n "$rojo" ]] || { echo 'Rojo binary missing'; exit 20; }
          chmod +x "$rojo"
          "$rojo" --version
          echo "ROJO_EXE=$rojo" >> "$GITHUB_ENV"

      - name: Build exact After School City place
        shell: bash
        run: |
          set -euo pipefail
          place="$RUNNER_TEMP/after-school-city-v046.rbxl"
          "$ROJO_EXE" build 'asc-source/maps/after-school-city/default.project.json' -o "$place"
          test -f "$place"
          bytes=$(stat -c%s "$place")
          (( bytes >= 1024 )) || { echo "Generated RBXL suspiciously small: $bytes"; exit 21; }
          sha=$(sha256sum "$place" | awk '{print $1}')
          echo "PLACE_FILE=$place" >> "$GITHUB_ENV"
          echo "PLACE_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "PLACE_SHA256=$sha" >> "$GITHUB_ENV"
          echo "BUILD PASS bytes=$bytes sha256=$sha"

      - name: Publish Source Spatial Audit Fix v0.4.6 LIVE to Roblox
        shell: bash
        run: |
          set -euo pipefail
          url="https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published"
          http=$(curl -sS --location -o "$RUNNER_TEMP/asc-publish-response.json" -w '%{http_code}' \
            -X POST "$url" \
            -H "x-api-key: $ROBLOX_API_KEY" \
            -H 'Content-Type: application/octet-stream' \
            --data-binary "@$PLACE_FILE")
          body=$(cat "$RUNNER_TEMP/asc-publish-response.json")
          echo "Roblox publish HTTP $http"
          [[ "$http" =~ ^2[0-9][0-9]$ ]] || { echo "$body"; exit 30; }
          version=$(jq -r '.versionNumber // empty' "$RUNNER_TEMP/asc-publish-response.json")
          [[ -n "$version" ]] || { echo "Missing versionNumber: $body"; exit 31; }
          echo "PUBLISHED_VERSION=$version" >> "$GITHUB_ENV"
          echo "ROBLOX PUBLISH PASS version=$version"

      - name: Persist LIVE receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          jq -n \
            --arg status 'LIVE_PUBLISHED' \
            --arg project 'AFTER SCHOOL CITY' \
            --arg mode 'SOURCE_SPATIAL_AUDIT_FIX_V0_4_6' \
            --arg sourceRepo "$SOURCE_REPO" \
            --arg sourceCommit "$SOURCE_SHA" \
            --arg universeId "$UNIVERSE_ID" \
            --arg placeId "$PLACE_ID" \
            --arg versionNumber "$PUBLISHED_VERSION" \
            --arg rojoVersion '7.7.0' \
            --arg placeBytes "$PLACE_BYTES" \
            --arg placeSha256 "$PLACE_SHA256" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,project:$project,mode:$mode,sourceRepo:$sourceRepo,sourceCommit:$sourceCommit,universeId:$universeId,placeId:$placeId,versionNumber:($versionNumber|tonumber),rojoVersion:$rojoVersion,placeBytes:($placeBytes|tonumber),placeSha256:$placeSha256,runId:$runId,publishedAt:$publishedAt,note:"Source Spatial Audit Fix v0.4.6; exact locked source; dedication intro preserved."}' \
            > deploy-status/after-school-city-publish-source-spatial-v0-4-6.json
          cat deploy-status/after-school-city-publish-source-spatial-v0-4-6.json

          git config user.name 'After School City Publish Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/after-school-city-publish-source-spatial-v0-4-6.json
          git commit -m "Record After School City Source Spatial publish v${PUBLISHED_VERSION} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
