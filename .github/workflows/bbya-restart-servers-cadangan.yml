name: BBYA Restart Servers Cadangan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-restart-servers-cadangan.yml'
      - '.bbya-restart-servers-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bbya-restart-servers-cadangan
  cancel-in-progress: false

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BBYA_UNIVERSE: '8116636513'
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_PUBLISH_CADANGAN_01 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restart live BBYA servers
        id: restart
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ROBLOX_API_KEY:-}" ]]; then
            echo 'Missing secret ROBLOX_PUBLISH_CADANGAN_01'
            exit 2
          fi
          mkdir -p deploy-status
          body="$RUNNER_TEMP/restart-body.json"
          http=$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST "https://apis.roblox.com/cloud/v2/universes/${BBYA_UNIVERSE}:restartServers" \
            -H "x-api-key: ${ROBLOX_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d '{}')
          if [[ "$http" =~ ^2 ]]; then status='RESTART_REQUEST_ACCEPTED'; else status='RESTART_REQUEST_FAILED'; fi
          response=$(cat "$body" 2>/dev/null || true)
          jq -n \
            --arg status "$status" \
            --arg http "$http" \
            --arg universe "$BBYA_UNIVERSE" \
            --arg response "$response" \
            --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,http:$http,universeId:$universe,response:$response,recordedAt:$at}' \
            > deploy-status/bbya-restart-servers-cadangan.json
          cat deploy-status/bbya-restart-servers-cadangan.json
          [[ "$status" == 'RESTART_REQUEST_ACCEPTED' ]] || exit 3

      - name: Persist restart receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ -f deploy-status/bbya-restart-servers-cadangan.json ]] || exit 0
          git config user.name 'BBYA Restart Cadangan'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/bbya-restart-servers-cadangan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record BBYA server restart [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
