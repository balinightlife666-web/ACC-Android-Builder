name: MOSHI Alpha.6 Stable Migration Build

on:
  push:
    branches: [fix/moshi-compose-scope-alpha]
    paths:
      - '.github/workflows/moshi-alpha6-stable-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build MOSHI Alpha.6 endpoint-pinned debug APK
        working-directory: projects/moshi/android
        run: gradle :app:assembleDebug --stacktrace -PMOSHI_API_BASE_URL="https://america-assignments-donors-seo.trycloudflare.com"
      - name: Upload unsigned migration input
        uses: actions/upload-artifact@v4
        with:
          name: MOSHI-alpha6-signing-input
          path: projects/moshi/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
