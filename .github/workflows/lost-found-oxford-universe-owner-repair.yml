name: LOST FOUND Oxford Universe Owner Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lost-found-oxford-universe-owner-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lost-found-oxford-universe-owner-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROBLOX_KEY: ${{ secrets.ROCKET_RACOON_PUBLISH }}
      UNIVERSE_ID: '10745354451'
      EXPECTED_OWNER: '8878884630'
      PROJECT_DIR: lost-and-found-night-shift
      EXPECTED_SHA256: '14d9d148dac7ba464d0a8c2b7abbb2796be77feb4cf304182a5e98a277e59747'
      EXPECTED_BYTES: '28608'
      INVALID_ASSET_ID: '91598094761025'

    steps:
      - name: Checkout exact owner-repair source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify Oxford GLB
        id: model
        shell: bash
        run: |
          set -euo pipefail
          a="$PROJECT_DIR/assets/oxford_binary_v5/part00a.b64"
          b="$PROJECT_DIR/assets/oxford_binary_v5/part00b.b64"
          c="$PROJECT_DIR/assets/oxford_binary_v4/part01.b64"
          joined="$RUNNER_TEMP/oxford-owner.glb.gz.b64"
          out="$RUNNER_TEMP/oxford-owner.glb"
          [[ "$(git hash-object "$a")" == '2c4f1745473dcba49758c62c65bfcfdceb7f65c0' ]] || { echo PART00A_BLOB_MISMATCH; exit 10; }
          [[ "$(git hash-object "$b")" == '10ffd80d09bc0069e4e1e6daa317b05c3730910c' ]] || { echo PART00B_BLOB_MISMATCH; exit 11; }
          [[ "$(git hash-object "$c")" == '2973b6d3477cbe6d6ed399aa3a4057f191936d31' ]] || { echo PART01_BLOB_MISMATCH; exit 12; }
          cat "$a" "$b" "$c" > "$joined"
          [[ "$(stat -c%s "$joined")" == '19560' ]] || { echo PAYLOAD_LENGTH_MISMATCH; exit 13; }
          base64 -d "$joined" | gunzip > "$out"
          bytes=$(stat -c%s "$out")
          sha=$(sha256sum "$out" | awk '{print $1}')
          [[ "$bytes" == "$EXPECTED_BYTES" ]] || { echo "MODEL_BYTES_MISMATCH $bytes"; exit 14; }
          [[ "$sha" == "$EXPECTED_SHA256" ]] || { echo "MODEL_SHA_MISMATCH $sha"; exit 15; }
          printf 'glTF' | cmp -n 4 - "$out" >/dev/null || { echo GLB_MAGIC_INVALID; exit 16; }
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "OWNER_OXFORD_GLTF_PASS bytes=$bytes sha=$sha"

      - name: Validate LOST FOUND owner key
        id: key
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ROBLOX_KEY:-}" ]] || { echo ROBLOX_KEY_MISSING; exit 20; }
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST 'https://apis.roblox.com/api-keys/v1/introspect' \
            -H 'Content-Type: application/json' \
            --data "{\"apiKey\":\"$ROBLOX_KEY\"}")
          [[ "$code" == 200 ]] || { cat "$tmp"; echo "KEY_INTROSPECT_HTTP_$code"; exit 21; }
          uid=$(jq -r '.authorizedUserId // empty' "$tmp")
          [[ "$uid" == "$EXPECTED_OWNER" ]] || { echo "UNEXPECTED_KEY_OWNER $uid"; exit 22; }
          asset_rw=$(jq -r '[.scopes[]? | select(.name=="asset") | (.operations // [])[]] | (index("read") != null and index("write") != null)' "$tmp")
          perm_write=$(jq -r '[.scopes[]? | select(.name=="asset-permissions" or .name=="asset-permissions:write") | (.operations // ["write"])[]] | (index("write") != null)' "$tmp")
          universe_write=$(jq -r '[.scopes[]? | select(.name=="universe" or .name=="universe-places") | (.operations // [])[]] | (index("write") != null)' "$tmp")
          [[ "$asset_rw" == true ]] || { echo OWNER_KEY_MISSING_ASSET_RW; exit 23; }
          [[ "$perm_write" == true ]] || { echo OWNER_KEY_MISSING_ASSET_PERMISSION_WRITE; exit 24; }
          [[ "$universe_write" == true ]] || { echo OWNER_KEY_MISSING_UNIVERSE_WRITE; exit 25; }
          echo "user_id=$uid" >> "$GITHUB_OUTPUT"
          echo "OWNER_KEY_PASS user=$uid"
          rm -f "$tmp"

      - name: Verify owner key controls LOST FOUND universe
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' -H "x-api-key: $ROBLOX_KEY" \
            "https://apis.roblox.com/cloud/v2/universes/${UNIVERSE_ID}")
          cat "$tmp"
          echo
          [[ "$code" == 200 ]] || { echo "UNIVERSE_HTTP_$code"; exit 30; }
          owner=$(jq -r '.user // empty' "$tmp")
          [[ "$owner" == "users/$EXPECTED_OWNER" ]] || { echo "UNIVERSE_OWNER_MISMATCH $owner"; exit 31; }
          echo "UNIVERSE_OWNER_PASS $owner"
          rm -f "$tmp"

      - name: Create Oxford model under LOST FOUND owner
        id: create
        shell: bash
        env:
          MODEL_PATH: ${{ steps.model.outputs.path }}
          CREATOR_USER_ID: ${{ steps.key.outputs.user_id }}
        run: |
          set -euo pipefail
          request=$(jq -cn --arg uid "$CREATOR_USER_ID" \
            '{assetType:"Model",displayName:"LOST FOUND Oxford Formal Shoe",description:"Oxford formal shoe collectible for LOST & FOUND: NIGHT SHIFT",creationContext:{creator:{userId:$uid}}}')
          tmp=$(mktemp)
          code=$(curl -sS --location -o "$tmp" -w '%{http_code}' \
            -X POST 'https://apis.roblox.com/assets/v1/assets' \
            -H "x-api-key: $ROBLOX_KEY" \
            --form-string "request=$request" \
            --form "fileContent=@${MODEL_PATH};type=model/gltf-binary")
          cat "$tmp"
          echo
          [[ "$code" =~ ^20[0-2]$ ]] || { echo "MODEL_UPLOAD_HTTP_$code"; exit 40; }
          path=$(jq -r '.path // empty' "$tmp")
          [[ -n "$path" ]] || { echo MODEL_OPERATION_PATH_MISSING; exit 41; }
          echo "operation_path=$path" >> "$GITHUB_OUTPUT"
          rm -f "$tmp"

      - name: Resolve owner-created Oxford asset
        id: asset
        shell: bash
        env:
          OPERATION_PATH: ${{ steps.create.outputs.operation_path }}
        run: |
          set -euo pipefail
          url="https://apis.roblox.com/assets/v1/${OPERATION_PATH#/}"
          last="$RUNNER_TEMP/owner-operation.json"
          : > "$last"
          for i in $(seq 1 100); do
            code=$(curl -sS -o "$last" -w '%{http_code}' -H "x-api-key: $ROBLOX_KEY" "$url")
            if [[ "$code" == 200 && "$(jq -r '.done // false' "$last")" == true ]]; then break; fi
            sleep 3
          done
          cat "$last"
          echo
          [[ "$(jq -r '.done // false' "$last")" == true ]] || { echo MODEL_OPERATION_TIMEOUT; exit 50; }
          [[ -z "$(jq -r '.error.code // empty' "$last")" ]] || { echo MODEL_OPERATION_FAILED; exit 51; }
          id=$(jq -r '.response.assetId // empty' "$last")
          [[ "$id" =~ ^[1-9][0-9]*$ ]] || { echo MODEL_ASSET_ID_MISSING; exit 52; }
          [[ "$id" != "$INVALID_ASSET_ID" ]] || { echo OWNER_ASSET_REUSED_INVALID_ID; exit 53; }
          state=$(jq -r '.response.state // empty' "$last")
          moderation=$(jq -r '.response.moderationResult.moderationState // empty' "$last")
          echo "asset_id=$id" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "moderation=$moderation" >> "$GITHUB_OUTPUT"
          echo "OWNER_MODEL_CREATED assetId=$id state=$state moderation=$moderation"

      - name: Verify owner-created asset metadata
        id: metadata
        shell: bash
        env:
          ASSET_ID: ${{ steps.asset.outputs.asset_id }}
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          for i in $(seq 1 60); do
            code=$(curl -sS -o "$tmp" -w '%{http_code}' -H "x-api-key: $ROBLOX_KEY" \
              "https://apis.roblox.com/assets/v1/assets/${ASSET_ID}?readMask=moderationResult,state,displayName,creationContext")
            state=$(jq -r '.state // empty' "$tmp" 2>/dev/null)
            moderation=$(jq -r '.moderationResult.moderationState // empty' "$tmp" 2>/dev/null)
            if [[ "$code" == 200 && "$state" == Active && "$moderation" == Approved ]]; then break; fi
            sleep 3
          done
          cat "$tmp"
          echo
          [[ "$code" == 200 ]] || { echo "ASSET_METADATA_HTTP_$code"; exit 60; }
          creator=$(jq -r '.creationContext.creator.userId // empty' "$tmp")
          state=$(jq -r '.state // empty' "$tmp")
          moderation=$(jq -r '.moderationResult.moderationState // empty' "$tmp")
          [[ "$creator" == "$EXPECTED_OWNER" ]] || { echo "ASSET_CREATOR_MISMATCH $creator"; exit 61; }
          [[ "$state" == Active ]] || { echo "ASSET_NOT_ACTIVE $state"; exit 62; }
          [[ "$moderation" == Approved ]] || { echo "ASSET_NOT_APPROVED $moderation"; exit 63; }
          echo "OWNER_ASSET_METADATA_PASS id=$ASSET_ID creator=$creator"
          rm -f "$tmp"

      - name: Grant owner-created Oxford asset to LOST FOUND universe
        id: permission
        shell: bash
        env:
          ASSET_ID: ${{ steps.asset.outputs.asset_id }}
        run: |
          set -euo pipefail
          payload=$(jq -cn --arg universe "$UNIVERSE_ID" --argjson asset "$ASSET_ID" \
            '{subjectType:"Universe",subjectId:$universe,action:"Use",requests:[{assetId:$asset}]}')
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' -X PATCH \
            'https://apis.roblox.com/asset-permissions-api/v1/assets/permissions' \
            -H "x-api-key: $ROBLOX_KEY" \
            -H 'Content-Type: application/json-patch+json' \
            --data "$payload")
          cat "$tmp" || true
          echo
          [[ "$code" =~ ^20[0-4]$ ]] || { echo "PERMISSION_HTTP_$code"; exit 70; }
          success=$(jq -r --argjson id "$ASSET_ID" '(.successAssetIds // []) | any(. == $id)' "$tmp" 2>/dev/null || echo false)
          err=$(jq -r --argjson id "$ASSET_ID" '(.errors // []) | map(select(.assetId == $id)) | first | .code // empty' "$tmp" 2>/dev/null || true)
          [[ "$success" == true ]] || { echo "PERMISSION_SEMANTIC_FAILURE code=${err:-UNKNOWN}"; exit 71; }
          [[ -z "$err" ]] || { echo "PERMISSION_REPORTED_ERROR $err"; exit 72; }
          echo "http=$code" >> "$GITHUB_OUTPUT"
          echo "UNIVERSE_PERMISSION_CONFIRMED asset=$ASSET_ID universe=$UNIVERSE_ID"
          rm -f "$tmp"

      - name: Register universe-owned Oxford and trigger canonical publish
        shell: bash
        env:
          ASSET_ID: ${{ steps.asset.outputs.asset_id }}
          PERMISSION_HTTP: ${{ steps.permission.outputs.http }}
        run: |
          set -euo pipefail
          python3 - "$ASSET_ID" <<'PY'
          import pathlib,re,sys
          asset_id=sys.argv[1]
          p=pathlib.Path('lost-and-found-night-shift/src/shared/ExternalCollectibleAssets.lua')
          text=p.read_text(encoding='utf-8')
          text,n=re.subn(r'assetId\s*=\s*\d+\s*,\s*-- ROBLOX_ASSET_ID',f'assetId = {asset_id}, -- ROBLOX_ASSET_ID',text,count=1)
          if n != 1: raise SystemExit('ASSET_REGISTRY_TOKEN_NOT_FOUND')
          text=re.sub(r'optimizedSha256\s*=\s*"[^"]+"', 'optimizedSha256 = "14d9d148dac7ba464d0a8c2b7abbb2796be77feb4cf304182a5e98a277e59747"', text, count=1)
          text=re.sub(r'optimizedBytes\s*=\s*\d+', 'optimizedBytes = 28608', text, count=1)
          p.write_text(text,encoding='utf-8')
          t=pathlib.Path('.lost-found-m0-trigger')
          src=t.read_text(encoding='utf-8') if t.exists() else ''
          line=f'M5-C.3 Oxford universe-owned model asset: {asset_id}'
          if re.search(r'^M5-C\.3 Oxford (?:external|universe-owned) model asset: .*$',src,flags=re.M):
              src=re.sub(r'^M5-C\.3 Oxford (?:external|universe-owned) model asset: .*$',line,src,flags=re.M)
          else:
              src=src.rstrip()+"\n"+line+"\n"
          t.write_text(src,encoding='utf-8')
          PY

          mkdir -p deploy-status
          jq -n \
            --arg status 'ASSET_OWNER_MATCHED_GRANTED_AND_REGISTERED' \
            --arg project 'LOST & FOUND: NIGHT SHIFT' \
            --arg assetName 'Oxford Formal Shoe' \
            --arg assetId "$ASSET_ID" \
            --arg universeId "$UNIVERSE_ID" \
            --arg ownerUserId "$EXPECTED_OWNER" \
            --arg modelSha256 "$EXPECTED_SHA256" \
            --arg modelBytes "$EXPECTED_BYTES" \
            --arg permissionHttp "$PERMISSION_HTTP" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg registeredAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,project:$project,assetName:$assetName,assetId:($assetId|tonumber),universeId:$universeId,ownerUserId:$ownerUserId,modelSha256:$modelSha256,modelBytes:($modelBytes|tonumber),permissionHttp:$permissionHttp,sourceCommit:$sourceCommit,runId:$runId,registeredAt:$registeredAt}' \
            > deploy-status/lost-found-oxford-model.json
          cat deploy-status/lost-found-oxford-model.json

          git config user.name 'Lost Found Oxford Owner Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lost-and-found-night-shift/src/shared/ExternalCollectibleAssets.lua deploy-status/lost-found-oxford-model.json .lost-found-m0-trigger
          git commit -m "Register universe-owned LOST FOUND Oxford model ${ASSET_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
