name: LOST & FOUND Oxford Shoe Asset Upload

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lost-found-oxford-shoe-asset-upload
  cancel-in-progress: false

jobs:
  upload-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROBLOX_ASSET_KEY: ${{ secrets.ROBLOX_PUBLISH_CADANGAN_AUDII_01 }}
      DRIVE_FILE_ID: '1gJaO7KSu-iN0-saIysY1iliQAdJXs39r'
      EXPECTED_SHA256: '782c33aedd463cdad4076ea0471ade44e53c74a436a35d796cf90e13f93d2494'
      LOST_FOUND_UNIVERSE_ID: '10745354451'
      EXPECTED_UPLOADER_USERNAME: 'gudangpet88'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Roblox asset key
        id: key
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ROBLOX_ASSET_KEY:-}" ]] || { echo ROBLOX_ASSET_KEY_MISSING; exit 10; }
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST 'https://apis.roblox.com/api-keys/v1/introspect' \
            -H 'Content-Type: application/json' \
            --data "{\"apiKey\":\"$ROBLOX_ASSET_KEY\"}")
          [[ "$code" == 200 ]] || { cat "$tmp"; echo INTROSPECT_HTTP_$code; exit 11; }
          python3 - "$tmp" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          scopes=d.get('scopes') or []
          asset=any(s.get('name')=='asset' and {'read','write'}.issubset(set(s.get('operations') or [])) for s in scopes)
          perm=any(s.get('name')=='asset-permissions:write' or (s.get('name')=='asset-permissions' and 'write' in (s.get('operations') or [])) for s in scopes)
          if d.get('expired') is True: raise SystemExit('KEY_EXPIRED')
          if d.get('enabled') is False: raise SystemExit('KEY_DISABLED')
          if not asset: raise SystemExit('MISSING_ASSET_RW')
          if not perm: raise SystemExit('MISSING_ASSET_PERMISSION_WRITE')
          uid=d.get('authorizedUserId')
          if not uid: raise SystemExit('AUTHORIZED_USER_MISSING')
          print('AUTHORIZED_USER_ID='+str(uid))
          open('/tmp/roblox-user-id','w').write(str(uid))
          PY
          rm -f "$tmp"

      - name: Verify uploader identity
        shell: bash
        run: |
          set -euo pipefail
          uid=$(cat /tmp/roblox-user-id)
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' "https://users.roblox.com/v1/users/$uid")
          [[ "$code" == 200 ]] || { cat "$tmp"; exit 12; }
          actual=$(jq -r '.name // empty' "$tmp")
          echo "uploader=$actual userId=$uid"
          [[ "${actual,,}" == "${EXPECTED_UPLOADER_USERNAME,,}" ]] || { echo UPLOADER_ACCOUNT_MISMATCH; exit 13; }
          rm -f "$tmp"

      - name: Download optimized Oxford GLB
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown
          out="$RUNNER_TEMP/lost-found-oxford-shoe.glb"
          gdown "https://drive.google.com/uc?id=${DRIVE_FILE_ID}" -O "$out"
          [[ -s "$out" ]] || { echo OXFORD_GLB_DOWNLOAD_EMPTY; exit 20; }
          size=$(stat -c%s "$out")
          sha=$(sha256sum "$out" | awk '{print $1}')
          echo "size=$size sha256=$sha"
          [[ "$sha" == "$EXPECTED_SHA256" ]] || { echo OXFORD_GLB_SHA256_MISMATCH; exit 21; }
          [[ "$size" -lt 20000000 ]] || { echo OXFORD_GLB_TOO_LARGE; exit 22; }
          echo "OXFORD_GLB=$out" >> "$GITHUB_ENV"

      - name: Create Roblox Model asset
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          uid=$(cat /tmp/roblox-user-id)
          request=$(jq -cn --arg uid "$uid" '{assetType:"Model",displayName:"LOST & FOUND Oxford Formal Shoe",description:"Collectible visual for LOST & FOUND: NIGHT SHIFT. Source: Oxford style leather shoe for men by assetfactorypremium on Sketchfab (model 632ce6f25dec417e81b6998bae1ea3e1). License: Sketchfab Free Standard.",creationContext:{creator:{userId:$uid}}}')
          tmp=$(mktemp)
          code=$(curl -sS --location -o "$tmp" -w '%{http_code}' 'https://apis.roblox.com/assets/v1/assets' \
            --header "x-api-key: $ROBLOX_ASSET_KEY" \
            --form-string "request=$request" \
            --form "fileContent=@${OXFORD_GLB};type=model/gltf-binary")
          cat "$tmp"
          echo
          [[ "$code" == 200 || "$code" == 201 || "$code" == 202 ]] || { echo CREATE_ASSET_HTTP_$code; exit 30; }
          op=$(jq -r '.path // empty' "$tmp")
          [[ -n "$op" ]] || { echo CREATE_ASSET_OPERATION_PATH_MISSING; exit 31; }
          echo "operation_path=$op" >> "$GITHUB_OUTPUT"
          rm -f "$tmp"

      - name: Poll asset operation
        id: poll
        shell: bash
        env:
          OP_PATH: ${{ steps.upload.outputs.operation_path }}
        run: |
          set -euo pipefail
          asset_id=''
          state=''
          operation_json='{}'
          for i in $(seq 1 100); do
            tmp=$(mktemp)
            code=$(curl -sS -o "$tmp" -w '%{http_code}' "https://apis.roblox.com/assets/v1/${OP_PATH#/}" --header "x-api-key: $ROBLOX_ASSET_KEY")
            if [[ "$code" == 200 ]]; then
              operation_json=$(cat "$tmp")
              if [[ $(jq -r '.done // false' "$tmp") == true ]]; then
                asset_id=$(jq -r '.response.assetId // empty' "$tmp")
                state=$(jq -r '.response.moderationResult.moderationState // empty' "$tmp")
                if [[ -n "$asset_id" ]]; then rm -f "$tmp"; break; fi
                err=$(jq -c '.error // empty' "$tmp")
                echo "operation_done_without_asset error=$err"
                rm -f "$tmp"
                exit 40
              fi
            fi
            rm -f "$tmp"
            sleep 3
          done
          [[ -n "$asset_id" ]] || { echo ASSET_ID_TIMEOUT; exit 41; }
          echo "asset_id=$asset_id" >> "$GITHUB_OUTPUT"
          echo "moderation_state=$state" >> "$GITHUB_OUTPUT"
          printf '%s' "$operation_json" > /tmp/oxford-operation.json
          echo "assetId=$asset_id moderation=$state"

      - name: Grant LOST & FOUND universe use permission
        id: permission
        shell: bash
        env:
          ASSET_ID: ${{ steps.poll.outputs.asset_id }}
        run: |
          set -euo pipefail
          payload=$(jq -cn --arg uid "$LOST_FOUND_UNIVERSE_ID" --argjson aid "$ASSET_ID" '{subjectType:"Universe",subjectId:$uid,action:"Use",requests:[{assetId:$aid}]}')
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' -X PATCH 'https://apis.roblox.com/asset-permissions-api/v1/assets/permissions' \
            -H "x-api-key: $ROBLOX_ASSET_KEY" \
            -H 'Content-Type: application/json-patch+json' \
            --data "$payload")
          cat "$tmp"; echo
          [[ "$code" == 200 || "$code" == 201 || "$code" == 204 ]] || { echo ASSET_PERMISSION_HTTP_$code; exit 50; }
          echo "http=$code" >> "$GITHUB_OUTPUT"
          rm -f "$tmp"

      - name: Write Oxford asset receipt
        shell: bash
        env:
          ASSET_ID: ${{ steps.poll.outputs.asset_id }}
          MODERATION_STATE: ${{ steps.poll.outputs.moderation_state }}
          PERMISSION_HTTP: ${{ steps.permission.outputs.http }}
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          jq -n \
            --arg status 'ASSET_UPLOADED' \
            --arg assetId "$ASSET_ID" \
            --arg modelUid '632ce6f25dec417e81b6998bae1ea3e1' \
            --arg source 'Sketchfab: Oxford style leather shoe for men by assetfactorypremium' \
            --arg license 'Sketchfab Free Standard' \
            --arg sourceSha256 "$EXPECTED_SHA256" \
            --arg moderationState "$MODERATION_STATE" \
            --arg universeId "$LOST_FOUND_UNIVERSE_ID" \
            --arg permissionHttp "$PERMISSION_HTTP" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg uploadedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,assetId:$assetId,modelUid:$modelUid,source:$source,license:$license,sourceSha256:$sourceSha256,moderationState:$moderationState,universeId:$universeId,permissionHttp:$permissionHttp,runId:$runId,sourceCommit:$sourceCommit,uploadedAt:$uploadedAt}' \
            > deploy-status/lost-found-oxford-shoe-asset.json
          cat deploy-status/lost-found-oxford-shoe-asset.json

      - name: Persist receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LOST FOUND Asset Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/lost-found-oxford-shoe-asset.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record LOST & FOUND Oxford shoe asset [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
