name: BBYA Funkot Track01 Terminalize

on:
  push:
    branches: [main]
    paths:
      - '.bbya-funkot-track01-terminalize'
      - '.github/workflows/bbya-funkot-track01-terminalize.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bbya-funkot-audio-cadangan-01
  cancel-in-progress: false

jobs:
  terminalize_and_continue:
    runs-on: ubuntu-latest
    env:
      SOURCE_TOKEN: ${{ secrets.ACC_ROBLOX_MAPS_WRITE_TOKEN || secrets.ACC_ROBLOX_MAPS_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: ardarawk-cloud/ACC-Roblox-maps
          ref: main
          token: ${{ env.SOURCE_TOKEN }}
          path: source
          fetch-depth: 0

      - name: Permanently terminalize Track 01 technical duration rejection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, datetime
          root=pathlib.Path('source')
          regp=root/'maps/bbya-social-hub/audio-playlists/funkot.json'
          blp=root/'maps/bbya-social-hub/audio-playlists/funkot-blacklist.json'
          reg=json.loads(regp.read_text(encoding='utf-8'))
          track=next(t for t in reg['tracks'] if int(t.get('index',0))==1)
          if track.get('assetId'):
              raise SystemExit('Refusing terminalization: Track01 unexpectedly has assetId')
          track['sourceSha256']='a61ae24bfa273c9c4d5f40a441ddda5d8c2a8e8a50ee685e829cb806f70804a4'
          track['status']='BLACKLISTED_PLATFORM_DURATION_LIMIT'
          track['bbyaPermission']=False
          track['moderationLastKnown']=None
          track['platformRejectCode']='InvalidArgument'
          track['platformRejectMessage']='Audio duration too long'
          track['platformOperationId']='522c90d2-6256-4291-81e3-228e341c20d1'
          track['blacklistedAt']='2026-08-24T15:09:13+00:00'
          regp.write_text(json.dumps(reg,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          bl=json.loads(blp.read_text(encoding='utf-8')) if blp.exists() else {'playlistId':'funkot','entries':[]}
          entries=bl.setdefault('entries',[])
          if not any(int(x.get('index',0))==1 and x.get('reason')=='ROBLOX_PLATFORM_AUDIO_DURATION_TOO_LONG' for x in entries):
              entries.append({
                'index':1,
                'title':track.get('title'),
                'driveFileId':track.get('driveFileId'),
                'assetId':None,
                'sourceSha256':track.get('sourceSha256'),
                'reason':'ROBLOX_PLATFORM_AUDIO_DURATION_TOO_LONG',
                'platformCode':'InvalidArgument',
                'platformMessage':'Audio duration too long',
                'operationId':'522c90d2-6256-4291-81e3-228e341c20d1',
                'blacklistedAt':'2026-08-24T15:09:13+00:00'
              })
          blp.write_text(json.dumps(bl,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps({'trackIndex':1,'status':track['status'],'sourceSha256':track['sourceSha256']}))
          PY

      - name: Persist Source of Truth
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git config user.name 'BBYA Funkot Cadangan 01'
          git config user.email 'actions@users.noreply.github.com'
          git add maps/bbya-social-hub/audio-playlists/funkot.json maps/bbya-social-hub/audio-playlists/funkot-blacklist.json
          if git diff --cached --quiet; then
            echo TRACK01_TERMINAL_ALREADY_CURRENT
          else
            git commit -m 'Blacklist BBYA Funkot Track01 platform duration rejection [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Dispatch next Funkot queue item
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/bbya-funkot-audio-cadangan-01.yml/dispatches" \
            -d '{"ref":"main","inputs":{"track_index":"auto"}}')
          cat /tmp/dispatch.out || true
          [[ "$code" == '204' ]] || { echo DISPATCH_HTTP_$code; exit 40; }
          echo NEXT_FUNKOT_DISPATCHED
