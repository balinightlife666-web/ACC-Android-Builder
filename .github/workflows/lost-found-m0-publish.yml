name: Lost & Found M0 Publish

on:
  push:
    branches: [main]
    paths:
      - '.lost-found-m0-trigger'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: lost-found-m0-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'LOST FOUND M0 PUBLISH')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_DIR: lost-and-found-night-shift
      UNIVERSE_ID: '10745354451'
      PLACE_ID: '93699016600671'
      ROBLOX_API_KEY: ${{ secrets.ROCKET_RACOON_PUBLISH }}

    steps:
      - name: Checkout exact event source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Lock source identity
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "Source locked: $source_sha"

      - name: Static QC
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ROBLOX_API_KEY:-}" ]] || { echo 'ROCKET_RACOON_PUBLISH missing'; exit 10; }
          project="$PROJECT_DIR/default.project.json"
          test -f "$project"
          jq -e . "$project" >/dev/null
          test -f "$PROJECT_DIR/brain/MASTERPLAN.md"
          test -f "$PROJECT_DIR/brain/GAME_BIBLE.md"
          test -f "$PROJECT_DIR/brain/CURRENT_STATE.md"
          test -f "$PROJECT_DIR/brain/M4D_PERSONAL_STATION_LOCK.md"
          test -f "$PROJECT_DIR/src/server/Main.server.lua"
          test -f "$PROJECT_DIR/src/server/WorldBuilder.lua"
          test -f "$PROJECT_DIR/src/server/PersonalStationWorld.lua"
          test -f "$PROJECT_DIR/src/server/PersonalShiftRuntime.lua"
          test -f "$PROJECT_DIR/src/shared/StationSkinRegistry.lua"
          test -f "$PROJECT_DIR/src/shared/CaseRegistry.lua"
          test -f "$PROJECT_DIR/src/client/Main.client.lua"
          test -f "$PROJECT_DIR/src/client/StationHUD.client.lua"
          test -f "$PROJECT_DIR/src/client/StationPromptFilter.client.lua"
          grep -Fq '10745354451' "$PROJECT_DIR/brain/CURRENT_STATE.md"
          grep -Fq '93699016600671' "$PROJECT_DIR/brain/CURRENT_STATE.md"
          grep -Fq 'M0 — FIRST SUITCASE' "$PROJECT_DIR/brain/CURRENT_STATE.md"
          grep -Fq 'RETURN' "$PROJECT_DIR/src/server/Main.server.lua"
          grep -Fq 'InitialServerStationCapacity = 8' "$PROJECT_DIR/src/shared/Config.lua"
          grep -Fq 'OwnerUserId' "$PROJECT_DIR/src/server/PersonalStationWorld.lua"
          grep -Fq 'stationOwners' "$PROJECT_DIR/src/server/PersonalShiftRuntime.lua"
          grep -Fq 'QUARANTINE' "$PROJECT_DIR/src/shared/CaseRegistry.lua"
          grep -Fq 'Flight 000' "$PROJECT_DIR/src/shared/CaseRegistry.lua"
          echo 'STATIC QC PASS'

      - name: Install Rojo 7.7.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rojo"
          curl -fsSL 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip' -o "$RUNNER_TEMP/rojo.zip"
          unzip -q -o "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/rojo"
          rojo="$(find "$RUNNER_TEMP/rojo" -type f -name rojo | head -n1)"
          [[ -n "$rojo" ]] || exit 20
          chmod +x "$rojo"
          "$rojo" --version
          echo "ROJO_EXE=$rojo" >> "$GITHUB_ENV"

      - name: Build M0 place
        shell: bash
        run: |
          set -euo pipefail
          place="$RUNNER_TEMP/lost-found-m0.rbxl"
          "$ROJO_EXE" build "$PROJECT_DIR/default.project.json" -o "$place"
          test -f "$place"
          bytes="$(stat -c%s "$place")"
          (( bytes >= 1024 )) || { echo "RBXL too small: $bytes"; exit 21; }
          sha="$(sha256sum "$place" | awk '{print $1}')"
          echo "PLACE_FILE=$place" >> "$GITHUB_ENV"
          echo "PLACE_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "PLACE_SHA256=$sha" >> "$GITHUB_ENV"
          echo "BUILD PASS bytes=$bytes sha256=$sha"

      - name: Publish M0 to Roblox
        shell: bash
        run: |
          set -euo pipefail
          url="https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published"
          http="$(curl -sS --location -o "$RUNNER_TEMP/publish.json" -w '%{http_code}' \
            -X POST "$url" \
            -H "x-api-key: $ROBLOX_API_KEY" \
            -H 'Content-Type: application/octet-stream' \
            --data-binary "@$PLACE_FILE")"
          echo "Roblox publish HTTP $http"
          cat "$RUNNER_TEMP/publish.json"
          [[ "$http" =~ ^2[0-9][0-9]$ ]] || exit 30
          version="$(jq -r '.versionNumber // empty' "$RUNNER_TEMP/publish.json")"
          [[ -n "$version" ]] || exit 31
          echo "PUBLISHED_VERSION=$version" >> "$GITHUB_ENV"
          echo "ROBLOX PUBLISH PASS version=$version"

      - name: Persist deploy receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          receipt='deploy-status/lost-and-found-m0.json'
          jq -n \
            --arg status 'LIVE_PUBLISHED' \
            --arg project 'LOST & FOUND: NIGHT SHIFT' \
            --arg milestone 'M4D_PERSONAL_SHIFTS' \
            --arg sourceRepo "$GITHUB_REPOSITORY" \
            --arg sourceCommit "$SOURCE_SHA" \
            --arg universeId "$UNIVERSE_ID" \
            --arg placeId "$PLACE_ID" \
            --arg versionNumber "$PUBLISHED_VERSION" \
            --arg rojoVersion '7.7.0' \
            --arg placeBytes "$PLACE_BYTES" \
            --arg placeSha256 "$PLACE_SHA256" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,project:$project,milestone:$milestone,sourceRepo:$sourceRepo,sourceCommit:$sourceCommit,universeId:$universeId,placeId:$placeId,versionNumber:($versionNumber|tonumber),rojoVersion:$rojoVersion,placeBytes:($placeBytes|tonumber),placeSha256:$placeSha256,runId:$runId,publishedAt:$publishedAt}' \
            > "$receipt"
          cat "$receipt"
          git config user.name 'Lost Found Publish Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$receipt"
          git commit -m "Record Lost & Found publish v${PUBLISHED_VERSION} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report success
        if: success() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `PASS — LOST & FOUND published. Roblox version ${process.env.PUBLISHED_VERSION}; source ${process.env.SOURCE_SHA}; Universe ${process.env.UNIVERSE_ID}; Place ${process.env.PLACE_ID}. Runtime gameplay still requires in-Roblox verification.`
            })
