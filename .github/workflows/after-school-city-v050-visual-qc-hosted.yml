name: After School City V0.5 Visual Fidelity QC Hosted

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/after-school-city-v050-visual-qc-hosted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_REPO: ardarawk-cloud/ACC-Roblox-maps
      SOURCE_SHA: ca68820c3833140ff6ff4552fcbc90a8914e278a

    steps:
      - name: Checkout publisher controller
        uses: actions/checkout@v4

      - name: Checkout exact AFTER SCHOOL CITY source
        uses: actions/checkout@v4
        with:
          repository: ardarawk-cloud/ACC-Roblox-maps
          ref: ca68820c3833140ff6ff4552fcbc90a8914e278a
          token: ${{ secrets.ACC_ROBLOX_MAPS_WRITE_TOKEN }}
          path: asc-source
          fetch-depth: 1

      - name: Verify exact V0.5 source lock
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git -C asc-source rev-parse HEAD)
          [[ "$actual" == "$SOURCE_SHA" ]] || { echo "Source SHA mismatch: $actual"; exit 11; }
          grep -Fq 'Version = "0.5.0-visual-fidelity-1"' asc-source/maps/after-school-city/after-school-city.config.lua
          grep -Fq 'EnableVisualFidelityPass = true' asc-source/maps/after-school-city/after-school-city.config.lua
          grep -Fq 'ASC_VisualFidelity' asc-source/maps/after-school-city/default.project.json
          grep -Fq 'after-school-city.visual-fidelity.server.lua' asc-source/maps/after-school-city/default.project.json
          echo "EXACT V0.5 SOURCE LOCK PASS $actual"

      - name: Cloud source spatial audit V4
        shell: pwsh
        working-directory: asc-source
        run: |
          $ErrorActionPreference='Stop'
          & '.github/scripts/after-school-city-spatial-audit.ps1'

      - name: Cloud source orientation audit V1
        shell: pwsh
        working-directory: asc-source
        run: |
          $ErrorActionPreference='Stop'
          & '.github/scripts/after-school-city-orientation-audit.ps1'

      - name: Cloud source visual fidelity audit V1
        shell: pwsh
        working-directory: asc-source
        run: |
          $ErrorActionPreference='Stop'
          & '.github/scripts/after-school-city-visual-fidelity-audit.ps1'

      - name: Static authority locks
        shell: bash
        run: |
          set -euo pipefail
          visual='asc-source/maps/after-school-city/after-school-city.visual-fidelity.server.lua'
          intro='asc-source/maps/after-school-city/after-school-city.intro.client.lua'
          grep -Fq 'V050_VisualFidelity' "$visual"
          grep -Fq 'ASC_DowntownInteriorWidthReconciled' "$visual"
          grep -Fq 'ASC_StudentRowDoorTreesCleared' "$visual"
          grep -Fq 'ASC_SkateSignCompacted' "$visual"
          grep -Fq 'PUTU AZYA PUTRI' "$intro"
          grep -Fq 'BINTANG HARDAJAYA' "$intro"
          grep -Fq 'WITH LOVE, DAD' "$intro"
          grep -Fq 'ENTER THE CITY' "$intro"
          if grep -Eq 'MarketplaceService|PromptProductPurchase|ProcessReceipt|DataStoreService|BillboardGui' "$visual"; then
            echo 'Forbidden authority/debug marker in V0.5 visual layer'
            exit 12
          fi
          echo 'V0.5 STATIC AUTHORITY LOCK PASS'

      - name: Prepare Rojo 7.7.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc-rojo"
          curl -fsSL 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip' -o "$RUNNER_TEMP/rojo.zip"
          unzip -q -o "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/asc-rojo"
          rojo=$(find "$RUNNER_TEMP/asc-rojo" -type f -name rojo | head -n1)
          [[ -n "$rojo" ]] || { echo 'rojo binary missing'; exit 20; }
          chmod +x "$rojo"
          version=$("$rojo" --version)
          echo "$version"
          [[ "$version" == *'7.7.0'* ]] || { echo "Wrong Rojo: $version"; exit 21; }
          echo "ROJO_EXE=$rojo" >> "$GITHUB_ENV"

      - name: Build exact AFTER SCHOOL CITY V0.5
        shell: bash
        run: |
          set -euo pipefail
          place="$RUNNER_TEMP/after-school-city-v050.rbxl"
          "$ROJO_EXE" build 'asc-source/maps/after-school-city/default.project.json' -o "$place"
          test -f "$place"
          bytes=$(stat -c%s "$place")
          (( bytes >= 1024 )) || { echo "Generated RBXL suspiciously small: $bytes"; exit 22; }
          sha=$(sha256sum "$place" | awk '{print $1}')
          echo "AFTER SCHOOL CITY V0.5 HOSTED QC PASS bytes=$bytes sha256=$sha source=$SOURCE_SHA"
