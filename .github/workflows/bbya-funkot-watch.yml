name: BBYA Funkot Watch

on:
  push:
    branches: [main]
    paths:
      - '.bbya-funkot-watch'
      - '.github/workflows/bbya-funkot-watch.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture latest Funkot target run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/bbya-funkot-audio-cadangan-01.yml/runs?per_page=5" \
            > /tmp/runs.json
          jq '{workflow_runs:[.workflow_runs[]|{id,status,conclusion,event,created_at,updated_at,html_url,head_sha}]}' /tmp/runs.json > deploy-status/bbya-funkot-runs.json
          latest=$(jq -r '.workflow_runs[0].id // empty' /tmp/runs.json)
          if [[ -n "$latest" ]]; then
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${latest}/jobs?per_page=100" \
              > /tmp/jobs.json
            jq --arg runId "$latest" '{runId:$runId,jobs:[.jobs[]|{id,name,status,conclusion,started_at,completed_at,steps:[.steps[]|{name,status,conclusion,number}]}]}' /tmp/jobs.json > deploy-status/bbya-funkot-latest-jobs.json
          else
            echo '{"runId":null,"jobs":[]}' > deploy-status/bbya-funkot-latest-jobs.json
          fi
          cat deploy-status/bbya-funkot-runs.json
          cat deploy-status/bbya-funkot-latest-jobs.json

      - name: Persist watcher receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BBYA Funkot Watch'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/bbya-funkot-runs.json deploy-status/bbya-funkot-latest-jobs.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record BBYA Funkot workflow status [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
