name: BBYA Amapiano Kick

on:
  push:
    branches: [main]
    paths:
      - '.bbya-amapiano-kick'
      - '.github/workflows/bbya-amapiano-kick.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dispatch safest next Amapiano queue item
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/bbya-amapiano-audio-cadangan-01.yml/dispatches" \
            -d '{"ref":"main","inputs":{"track_index":"auto"}}')
          body=$(cat /tmp/dispatch.out 2>/dev/null || true)
          status='FAILED'
          [[ "$code" == '204' ]] && status='DISPATCHED'
          jq -n \
            --arg status "$status" \
            --arg http "$code" \
            --arg dispatcherRunId "$GITHUB_RUN_ID" \
            --arg body "$body" \
            --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,http:$http,dispatcherRunId:$dispatcherRunId,response:$body,recordedAt:$at}' \
            > deploy-status/bbya-amapiano-kick.json
          cat deploy-status/bbya-amapiano-kick.json
          [[ "$code" == '204' ]] || exit 1

      - name: Persist dispatcher receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BBYA Amapiano Kick'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/bbya-amapiano-kick.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record BBYA Amapiano dispatch [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
