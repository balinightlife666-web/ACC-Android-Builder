name: BBYA Amapiano Kick

on:
  push:
    branches: [main]
    paths:
      - '.bbya-amapiano-kick'
      - '.github/workflows/bbya-amapiano-kick.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Snapshot latest Amapiano runs only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/bbya-amapiano-audio-cadangan-01.yml/runs?per_page=10" \
            > /tmp/runs.json
          jq '{status:"MONITOR_ONLY",recordedAt:(now|todateiso8601),runs:[.workflow_runs[]|{id,run_number,event,status,conclusion,created_at,run_started_at,updated_at,head_sha,html_url}]}' /tmp/runs.json \
            > deploy-status/bbya-amapiano-kick.json
          cat deploy-status/bbya-amapiano-kick.json

      - name: Persist monitor receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BBYA Amapiano Monitor'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/bbya-amapiano-kick.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Monitor BBYA Amapiano run [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
