name: BBYA Amapiano Kick

on:
  push:
    branches: [main]
    paths:
      - '.bbya-amapiano-kick'
      - '.github/workflows/bbya-amapiano-kick.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch safest next Amapiano queue item
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/bbya-amapiano-audio-cadangan-01.yml/dispatches" \
            -d '{"ref":"main","inputs":{"track_index":"auto"}}')
          cat /tmp/dispatch.out || true
          [[ "$code" == "204" ]] || { echo "DISPATCH_HTTP_$code"; exit 1; }
          echo 'AMAPIANO_AUDIO_DISPATCHED'
