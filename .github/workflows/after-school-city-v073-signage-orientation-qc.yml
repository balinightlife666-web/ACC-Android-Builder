name: After School City V0.7.3 Signage Orientation QC

on:
  push:
    branches: [main]
    paths: ['.github/workflows/after-school-city-v073-signage-orientation-qc.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: after-school-city-v073-signage-orientation-qc
  cancel-in-progress: false

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_REPO: ardarawk-cloud/ACC-Roblox-maps
      SOURCE_SHA: 29530dd451bb35d9d6d9e801435aca14f9ba7b5a
      BASE_LIVE_SHA: 1aaf8623cd5a59bc77bbb24bb8e0831a72642cc5
      EXPECTED_VERSION: 0.7.3-signage-orientation-hotfix-1
    steps:
      - name: Checkout QC repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact After School City source
        uses: actions/checkout@v4
        with:
          repository: ardarawk-cloud/ACC-Roblox-maps
          ref: 29530dd451bb35d9d6d9e801435aca14f9ba7b5a
          token: ${{ secrets.ACC_ROBLOX_MAPS_WRITE_TOKEN }}
          path: asc-source
          fetch-depth: 0

      - name: Verify exact source and narrow delta
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git -C asc-source rev-parse HEAD)
          [[ "$actual" == "$SOURCE_SHA" ]] || { echo "Source SHA mismatch: $actual"; exit 10; }
          git -C asc-source cat-file -e "${BASE_LIVE_SHA}^{commit}"
          mapfile -t files < <(git -C asc-source diff --name-only "$BASE_LIVE_SHA" "$SOURCE_SHA")
          printf '%s\n' "${files[@]}"
          [[ ${#files[@]} -eq 3 ]] || { echo "Unexpected V0.7.3 delta file count: ${#files[@]}"; exit 11; }
          expected=(
            'maps/after-school-city/after-school-city.config.lua'
            'maps/after-school-city/after-school-city.signage-orientation-hotfix.server.lua'
            'maps/after-school-city/default.project.json'
          )
          for f in "${expected[@]}"; do
            printf '%s\n' "${files[@]}" | grep -Fxq "$f" || { echo "Expected delta missing: $f"; exit 12; }
          done
          echo "SOURCE LOCK PASS source=$actual base=$BASE_LIVE_SHA delta=3-files"

      - name: Audit V0.7.3 signage orientation contract
        shell: pwsh
        working-directory: asc-source
        run: |
          $ErrorActionPreference='Stop'
          $map='maps/after-school-city'
          $hotfix=Get-Content "$map/after-school-city.signage-orientation-hotfix.server.lua" -Raw
          $config=Get-Content "$map/after-school-city.config.lua" -Raw
          $project=Get-Content "$map/default.project.json" -Raw
          $null=$project|ConvertFrom-Json
          function Need([string]$text,[string]$token,[string]$label){if($text.IndexOf($token,[StringComparison]::Ordinal)-lt 0){throw "V0.7.3 missing contract: $label"}}
          foreach($token in @(
            'V073_SignageOrientationHotfix',
            '0.7.3-signage-orientation-hotfix-1',
            'ASC_SchoolVisualDepthPass',
            'mainCF:PointToObjectSpace(leftMass.Position).X',
            'mainCF:PointToObjectSpace(rightMass.Position).X',
            'entry.gui.Face = signX < 0 and Enum.NormalId.Right or Enum.NormalId.Left',
            'entry.label.Text = "← " .. baseText',
            'entry.label.Text = baseText .. " →"',
            'V073OppositeSignage',
            'ASC_V073DirectionalSignFixed',
            'ASC_SignageOrientationPass'
          )){Need $hotfix $token $token}
          foreach($forbidden in @('MarketplaceService','PromptProductPurchase','ProcessReceipt','DataStoreService','BillboardGui','NorthSouthRoad')){
            if($hotfix -match [regex]::Escape($forbidden)){throw "Forbidden V0.7.3 scope token: $forbidden"}
          }
          foreach($token in @(
            'Version = "0.7.3-signage-orientation-hotfix-1"',
            'SchoolVisualDepthVersion = "0.7.2-school-visual-depth-1"',
            'SignageOrientationHotfixVersion = "0.7.3-signage-orientation-hotfix-1"',
            'EnableSignageOrientationHotfixPass = true',
            'EnableActivities = false',
            'EnableEconomy = false',
            'EnablePersistence = false',
            'EnablePersonalRoom = false',
            'EnableClubs = false'
          )){Need $config $token $token}
          Need $project 'ASC_SchoolVisualDepth' 'Rojo V0.7.2 node'
          Need $project 'ASC_SignageOrientationHotfix' 'Rojo V0.7.3 node'
          Need $project 'after-school-city.signage-orientation-hotfix.server.lua' 'Rojo V0.7.3 source'
          $i72=$project.IndexOf('ASC_SchoolVisualDepth',[StringComparison]::Ordinal)
          $i73=$project.IndexOf('ASC_SignageOrientationHotfix',[StringComparison]::Ordinal)
          if($i72 -lt 0 -or $i73 -lt 0 -or $i73 -le $i72){throw 'Rojo ordering invalid: V0.7.3 must follow V0.7.2'}
          Write-Host 'V0.7.3 SIGNAGE ORIENTATION AUDIT PASS gameplayAuthority=OFF'

      - name: Verify protected source unchanged
        shell: bash
        working-directory: asc-source
        run: |
          set -euo pipefail
          for f in \
            maps/after-school-city/after-school-city.intro.client.lua \
            maps/after-school-city/after-school-city.orientation-correction.server.lua \
            maps/after-school-city/after-school-city.road-centerline-clearance.server.lua \
            maps/after-school-city/after-school-city.premium-exterior.server.lua \
            maps/after-school-city/after-school-city.school-interior.server.lua \
            maps/after-school-city/after-school-city.school-interior-polish.server.lua \
            maps/after-school-city/after-school-city.school-visual-depth.server.lua; do
            git diff --quiet "$BASE_LIVE_SHA" "$SOURCE_SHA" -- "$f" || { echo "Protected source changed: $f"; exit 20; }
          done
          grep -Fq 'PUTU AZYA PUTRI' maps/after-school-city/after-school-city.intro.client.lua
          grep -Fq 'BINTANG HARDAJAYA' maps/after-school-city/after-school-city.intro.client.lua
          grep -Fq 'WITH LOVE, DAD' maps/after-school-city/after-school-city.intro.client.lua
          echo 'PROTECTED SOURCE PASS v22=UNCHANGED dedication=UNCHANGED road=UNCHANGED orientation=UNCHANGED'

      - name: Prepare Rojo 7.7.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc-rojo"
          curl -fsSL 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip' -o "$RUNNER_TEMP/rojo.zip"
          unzip -q -o "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/asc-rojo"
          rojo=$(find "$RUNNER_TEMP/asc-rojo" -type f -name rojo | head -n1)
          [[ -n "$rojo" ]] || exit 30
          chmod +x "$rojo"
          version=$("$rojo" --version)
          [[ "$version" == *'7.7.0'* ]] || { echo "Wrong Rojo: $version"; exit 31; }
          echo "ROJO_EXE=$rojo" >> "$GITHUB_ENV"

      - name: Build exact V0.7.3 place
        shell: bash
        run: |
          set -euo pipefail
          place="$RUNNER_TEMP/after-school-city-v073.rbxl"
          "$ROJO_EXE" build 'asc-source/maps/after-school-city/default.project.json' -o "$place"
          test -f "$place"
          bytes=$(stat -c%s "$place")
          (( bytes > 85445 )) || { echo "Unexpected build size: $bytes"; exit 40; }
          sha=$(sha256sum "$place" | awk '{print $1}')
          echo "PLACE_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "PLACE_SHA256=$sha" >> "$GITHUB_ENV"
          echo "BUILD PASS source=$SOURCE_SHA bytes=$bytes sha256=$sha"

      - name: Persist QC receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          jq -n \
            --arg status 'QC_PASS' \
            --arg project 'AFTER SCHOOL CITY' \
            --arg mode 'SIGNAGE_ORIENTATION_HOTFIX_V0_7_3' \
            --arg sourceRepo "$SOURCE_REPO" \
            --arg sourceCommit "$SOURCE_SHA" \
            --arg baseLiveCommit "$BASE_LIVE_SHA" \
            --arg rojoVersion '7.7.0' \
            --arg placeBytes "$PLACE_BYTES" \
            --arg placeSha256 "$PLACE_SHA256" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,project:$project,mode:$mode,sourceRepo:$sourceRepo,sourceCommit:$sourceCommit,baseLiveCommit:$baseLiveCommit,rojoVersion:$rojoVersion,placeBytes:($placeBytes|tonumber),placeSha256:$placeSha256,runId:$runId,checkedAt:$checkedAt,note:"Hosted QC only; NOT PUBLISHED. Directional school signage derived from current wing positions; corridor-facing SurfaceGui orientation corrected; room signs made readable on both physical faces; v22 protected source unchanged."}' \
            > deploy-status/after-school-city-v073-signage-orientation-qc.json
          cat deploy-status/after-school-city-v073-signage-orientation-qc.json
          git config user.name 'After School City QC Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/after-school-city-v073-signage-orientation-qc.json
          git commit -m "Record After School City V0.7.3 signage orientation QC [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
