# Owner-approved TRACK 01 v4.0.0 LIVE publish via RR key
name: Publish TRACK 01 via RR Key

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-track01-rr.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track01-rr-live-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_REPO: ardarawk-cloud/ACC-Roblox-maps
      SOURCE_SHA: 3656c04585a13b23816142ef0b2e8958e89f3fb6
      UNIVERSE_ID: '10745349805'
      PLACE_ID: '79748872921213'
      ROBLOX_API_KEY: ${{ secrets.ROCKET_RACOON_PUBLISH }}

    steps:
      - name: Checkout publisher repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout locked TRACK 01 source
        uses: actions/checkout@v4
        with:
          repository: ardarawk-cloud/ACC-Roblox-maps
          ref: 3656c04585a13b23816142ef0b2e8958e89f3fb6
          token: ${{ secrets.ACC_ROBLOX_MAPS_WRITE_TOKEN }}
          path: track-src
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preflight TRACK 01 v4.0.0 target lock
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ROBLOX_API_KEY:-}" ]] || { echo 'RR publisher credential missing'; exit 10; }
          actual=$(git -C track-src rev-parse HEAD)
          [[ "$actual" == "$SOURCE_SHA" ]] || { echo "Source SHA mismatch: $actual"; exit 11; }
          node - <<'NODE'
          const c=require('./track-src/maps/track-01/track01.config.json');
          if(String(c.universeId)!=='10745349805') throw new Error('Wrong Universe ID');
          if(String(c.placeId)!=='79748872921213') throw new Error('Wrong Place ID');
          if(String(c.version)!=='4.0.0') throw new Error('Wrong TRACK 01 source version: '+c.version);
          if(!c.enabled) throw new Error('TRACK 01 disabled');
          console.log('LOCK PASS TRACK 01',c.version,c.universeId,c.placeId);
          NODE

      - name: Build exact TRACK 01 place
        shell: bash
        run: |
          set -euo pipefail
          cd track-src
          node scripts/build-track01.js
          test -s maps/track-01/place.rbxlx
          grep -q 'TRACK01_NightVisibilityHotfix' maps/track-01/place.rbxlx
          grep -q 'ACC_TRACK01_NIGHT_VISIBILITY_READY' maps/track-01/place.rbxlx
          grep -q 'Lighting.Brightness=1.80' maps/track-01/place.rbxlx
          grep -q 'Lighting.ExposureCompensation=0.12' maps/track-01/place.rbxlx
          grep -q 'YardReadabilityFill' maps/track-01/place.rbxlx
          grep -q 'YardFillCenter' maps/track-01/place.rbxlx
          grep -q 'YardFillPhoto' maps/track-01/place.rbxlx
          grep -q 'TRACK01_FinalQC' maps/track-01/place.rbxlx
          grep -q 'ACC_TRACK01_FINAL_QC_READY' maps/track-01/place.rbxlx
          grep -q 'ACC_TRACK01_FEATURE_COMPLETE' maps/track-01/place.rbxlx
          grep -q 'TRACK01_SocialInteractions' maps/track-01/place.rbxlx
          grep -q 'NightDrinkTray' maps/track-01/place.rbxlx
          grep -q 'Car03DanceZone' maps/track-01/place.rbxlx
          grep -q 'YardPhotoSpot' maps/track-01/place.rbxlx
          grep -q 'TRACK01_LobbyArrivalHotfix' maps/track-01/place.rbxlx
          grep -q 'TRACK01_PAVolumeHotfix' maps/track-01/place.rbxlx
          grep -q 'TRACK01_TicketAccessVestibule' maps/track-01/place.rbxlx
          grep -q 'AudioTextToSpeech' maps/track-01/place.rbxlx
          grep -q 'TRACK01_EndOfLineHero' maps/track-01/place.rbxlx
          grep -q 'END OF LINE' maps/track-01/place.rbxlx
          grep -q 'TRACK01_AdminPanelServer' maps/track-01/place.rbxlx
          grep -q 'TRACK01_AdminPanelClient' maps/track-01/place.rbxlx
          grep -q 'TRACK01_AdminPAClient' maps/track-01/place.rbxlx
          grep -q 'ACC_TRACK01_ADMIN_PANEL_READY' maps/track-01/place.rbxlx
          grep -q 'ACC_TRACK01_PANEL_VERSION' maps/track-01/place.rbxlx
          grep -q 'TRACK01_ADMIN_USER_IDS' maps/track-01/place.rbxlx
          grep -q 'TRACK01_LIGHT_PULSE_ENABLED' maps/track-01/place.rbxlx
          grep -q 'NO KICK BUTTON' maps/track-01/place.rbxlx
          grep -q 'LAST TRAIN' maps/track-01/place.rbxlx
          bytes=$(stat -c%s maps/track-01/place.rbxlx)
          sha=$(sha256sum maps/track-01/place.rbxlx | awk '{print $1}')
          echo "PLACE_FILE=$GITHUB_WORKSPACE/track-src/maps/track-01/place.rbxlx" >> "$GITHUB_ENV"
          echo "PLACE_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "PLACE_SHA256=$sha" >> "$GITHUB_ENV"
          echo "BUILD PASS bytes=$bytes sha256=$sha"

      - name: Publish TRACK 01 v4.0.0 LIVE to Roblox
        shell: bash
        run: |
          set -euo pipefail
          url="https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published"
          http=$(curl -sS --location -o "$RUNNER_TEMP/track01-publish-response.json" -w '%{http_code}' \
            -X POST "$url" \
            -H "x-api-key: $ROBLOX_API_KEY" \
            -H 'Content-Type: application/octet-stream' \
            --data-binary "@$PLACE_FILE")
          body=$(cat "$RUNNER_TEMP/track01-publish-response.json")
          echo "Roblox publish HTTP $http"
          [[ "$http" =~ ^2[0-9][0-9]$ ]] || { echo "$body"; exit 30; }
          version=$(jq -r '.versionNumber // empty' "$RUNNER_TEMP/track01-publish-response.json")
          [[ -n "$version" ]] || { echo "Missing versionNumber: $body"; exit 31; }
          [[ "$version" =~ ^[0-9]+$ ]] || { echo "Invalid versionNumber: $version"; exit 32; }
          (( version > 23 )) || { echo "Roblox version did not increment beyond verified v23: $version"; exit 33; }
          echo "PUBLISHED_VERSION=$version" >> "$GITHUB_ENV"
          echo "ROBLOX PUBLISH PASS version=$version"

      - name: Persist TRACK 01 LIVE receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          jq -n \
            --arg status 'LIVE_PUBLISHED' \
            --arg project 'TRACK 01' \
            --arg mode 'RR_KEY_V4_0_0' \
            --arg sourceRepo "$SOURCE_REPO" \
            --arg sourceCommit "$SOURCE_SHA" \
            --arg universeId "$UNIVERSE_ID" \
            --arg placeId "$PLACE_ID" \
            --arg versionNumber "$PUBLISHED_VERSION" \
            --arg placeBytes "$PLACE_BYTES" \
            --arg placeSha256 "$PLACE_SHA256" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,project:$project,mode:$mode,sourceRepo:$sourceRepo,sourceCommit:$sourceCommit,universeId:$universeId,placeId:$placeId,versionNumber:($versionNumber|tonumber),placeBytes:($placeBytes|tonumber),placeSha256:$placeSha256,runId:$runId,publishedAt:$publishedAt,previewUrl:"https://www.roblox.com/games/79748872921213"}' \
            > deploy-status/track01-rr.json
          cat deploy-status/track01-rr.json
          git config user.name 'TRACK 01 RR Publish Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/track01-rr.json
          git commit -m "Record TRACK 01 RR publish v${PUBLISHED_VERSION} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
