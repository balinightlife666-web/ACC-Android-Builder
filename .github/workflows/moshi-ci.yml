name: MOSHI CI

on:
  push:
    branches: [main]
    paths:
      - 'projects/moshi/**'
      - '.github/workflows/moshi-ci.yml'
      - '.github/workflows/moshi-alpha-apk.yml'
  pull_request:
    paths:
      - 'projects/moshi/**'
      - '.github/workflows/moshi-ci.yml'
      - '.github/workflows/moshi-alpha-apk.yml'

concurrency:
  group: moshi-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: projects/moshi/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Validate alpha compose
        env:
          MOSHI_POSTGRES_PASSWORD: ci-postgres-password
          MOSHI_JWT_SECRET: ci-only-jwt-secret-with-more-than-32-characters
        run: docker compose -f ../docker-compose.alpha.yml config >/dev/null
      - name: Build backend container
        run: docker build -t moshi-api:ci .

  android:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: projects/moshi/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MOSHI-debug-apk
          path: projects/moshi/android/app/build/outputs/apk/debug/app-debug.apk
