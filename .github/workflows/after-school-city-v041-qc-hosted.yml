name: After School City V041 Hosted QC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/after-school-city-v041-qc-hosted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_REPO: ardarawk-cloud/ACC-Roblox-maps
      SOURCE_SHA: 47cbf0f61c08d7ba691170476b9ce43f2f234b36

    steps:
      - name: Checkout publisher repository
        uses: actions/checkout@v4

      - name: Checkout locked ASC v0.4.1 source
        uses: actions/checkout@v4
        with:
          repository: ardarawk-cloud/ACC-Roblox-maps
          ref: 47cbf0f61c08d7ba691170476b9ce43f2f234b36
          token: ${{ secrets.ACC_ROBLOX_MAPS_WRITE_TOKEN }}
          path: asc-source
          fetch-depth: 1

      - name: Static source lock
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git -C asc-source rev-parse HEAD)
          [[ "$actual" == "$SOURCE_SHA" ]] || { echo "Source SHA mismatch: $actual"; exit 11; }
          project='asc-source/maps/after-school-city/default.project.json'
          config='asc-source/maps/after-school-city/after-school-city.config.lua'
          cleanup='asc-source/maps/after-school-city/after-school-city.spatial-cleanup.server.lua'
          jq -e . "$project" >/dev/null
          grep -Fq 'ASC_SpatialCleanup' "$project"
          grep -Fq 'after-school-city.spatial-cleanup.server.lua' "$project"
          grep -Fq '0.4.1-spatial-cleanup-1' "$config"
          grep -Fq 'EnableSpatialCleanupPass = true' "$config"
          grep -Fq 'V041_SpatialCleanup' "$cleanup"
          grep -Fq 'ASC_ClearanceChecked' "$cleanup"
          grep -Fq 'V041_ParkingAndVehicles' "$cleanup"
          grep -Fq 'V041_SchoolDowntownCorridor' "$cleanup"
          grep -Fq 'SchoolSportsRoad' "$cleanup"
          grep -Fq 'StudentMiniMart' "$cleanup"
          grep -Fq 'CommunityLibrary' "$cleanup"
          ! grep -Eq 'MarketplaceService|PromptProductPurchase|ProcessReceipt|DataStoreService|BillboardGui' "$cleanup"
          echo "ASC V0.4.1 STATIC LOCK PASS source=$actual"

      - name: Prepare Rojo 7.7.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc-rojo"
          curl -fsSL 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip' -o "$RUNNER_TEMP/rojo.zip"
          unzip -q -o "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/asc-rojo"
          rojo=$(find "$RUNNER_TEMP/asc-rojo" -type f -name rojo | head -n1)
          [[ -n "$rojo" ]] || { echo 'Rojo binary missing'; exit 20; }
          chmod +x "$rojo"
          "$rojo" --version
          echo "ROJO_EXE=$rojo" >> "$GITHUB_ENV"

      - name: Build exact ASC v0.4.1 place
        shell: bash
        run: |
          set -euo pipefail
          place="$RUNNER_TEMP/after-school-city-v041.rbxl"
          "$ROJO_EXE" build 'asc-source/maps/after-school-city/default.project.json' -o "$place"
          test -f "$place"
          bytes=$(stat -c%s "$place")
          (( bytes >= 1024 )) || { echo "Generated RBXL suspiciously small: $bytes"; exit 21; }
          sha=$(sha256sum "$place" | awk '{print $1}')
          echo "ASC V0.4.1 ROJO BUILD PASS bytes=$bytes sha256=$sha"
