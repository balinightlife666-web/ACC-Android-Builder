# Owner-approved AFTER SCHOOL CITY Road Centerline Clearance v0.5.3 LIVE publish
name: After School City Publish Road Centerline Clearance V0.5.3

on:
  push:
    branches: [main]
    paths: ['.github/workflows/after-school-city-publish-v053-road-centerline-clearance.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: after-school-city-live-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_REPO: ardarawk-cloud/ACC-Roblox-maps
      SOURCE_SHA: b18cbdf5d49ecb6d5f81f938069674836ffb935a
      UNIVERSE_ID: '10745359869'
      PLACE_ID: '121603385909425'
      ROBLOX_API_KEY: ${{ secrets.ROCKET_RACOON_PUBLISH }}
    steps:
      - name: Checkout publisher repository
        uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Checkout locked After School City source
        uses: actions/checkout@v4
        with:
          repository: ardarawk-cloud/ACC-Roblox-maps
          ref: b18cbdf5d49ecb6d5f81f938069674836ffb935a
          token: ${{ secrets.ACC_ROBLOX_MAPS_WRITE_TOKEN }}
          path: asc-source
          fetch-depth: 1

      - name: Preflight exact Road Centerline Clearance v0.5.3
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ROBLOX_API_KEY:-}" ]] || { echo 'ROCKET_RACOON_PUBLISH missing'; exit 10; }
          actual=$(git -C asc-source rev-parse HEAD)
          [[ "$actual" == "$SOURCE_SHA" ]] || { echo "Source SHA mismatch: $actual"; exit 11; }
          project='asc-source/maps/after-school-city/default.project.json'
          intro='asc-source/maps/after-school-city/after-school-city.intro.client.lua'
          config='asc-source/maps/after-school-city/after-school-city.config.lua'
          runtime='asc-source/maps/after-school-city/after-school-city.road-centerline-clearance.server.lua'
          jq -e . "$project" >/dev/null
          for token in 'ASC_RuntimeReconcile' 'ASC_RuntimeHardCleanup' 'ASC_RoadCenterlineClearance' 'after-school-city.runtime-reconcile.server.lua' 'after-school-city.runtime-hard-cleanup.server.lua' 'after-school-city.road-centerline-clearance.server.lua'; do grep -Fq "$token" "$project"; done
          for token in 'PUTU AZYA PUTRI' 'BINTANG HARDAJAYA' 'WITH LOVE, DAD' 'ENTER THE CITY'; do grep -Fq "$token" "$intro"; done
          for token in 'Version = "0.5.3-road-centerline-clearance-1"' 'RuntimeReconcileVersion = "0.5.1-runtime-reconcile-1"' 'RuntimeHardCleanupVersion = "0.5.2-runtime-hard-cleanup-1"' 'RoadCenterlineClearanceVersion = "0.5.3-road-centerline-clearance-1"' 'EnableRuntimeReconcilePass = true' 'EnableRuntimeHardCleanupPass = true' 'EnableRoadCenterlineClearancePass = true' 'EnableActivities = false' 'EnableEconomy = false' 'EnablePersistence = false'; do grep -Fq "$token" "$config"; done
          for token in 'V053_RoadCenterlineClearance' 'CentralFountain' 'DowntownPlazaWest' 'DowntownPlazaEast' 'ASC_DowntownPlazaSplitAroundRoad' 'ASC_CentralFountainRemovedFromRoad' 'ASC_MainRoadCenterlineHardClear' 'ASC_RoadCenterlineClearancePass'; do grep -Fq "$token" "$runtime"; done
          if grep -Eq 'MarketplaceService|PromptProductPurchase|ProcessReceipt|DataStoreService|BillboardGui' "$runtime"; then
            echo 'Forbidden authority/debug marker in V0.5.3 road centerline layer'
            exit 12
          fi
          echo "LOCK PASS source=$actual road_centerline_v0_5_3=PASS dedication=PASS"

      - name: Cloud source spatial audit V4
        shell: pwsh
        working-directory: asc-source
        run: |
          $ErrorActionPreference='Stop'
          & '.github/scripts/after-school-city-spatial-audit.ps1'

      - name: Cloud source orientation audit V1
        shell: pwsh
        working-directory: asc-source
        run: |
          $ErrorActionPreference='Stop'
          & '.github/scripts/after-school-city-orientation-audit.ps1'

      - name: Cloud source visual fidelity audit V1
        shell: pwsh
        working-directory: asc-source
        run: |
          $ErrorActionPreference='Stop'
          & '.github/scripts/after-school-city-visual-fidelity-audit.ps1'

      - name: Cloud source runtime reconcile audit V1
        shell: pwsh
        working-directory: asc-source
        run: |
          $ErrorActionPreference='Stop'
          & '.github/scripts/after-school-city-runtime-reconcile-audit.ps1'

      - name: Cloud source runtime hard cleanup audit V1
        shell: pwsh
        working-directory: asc-source
        run: |
          $ErrorActionPreference='Stop'
          & '.github/scripts/after-school-city-runtime-hard-cleanup-audit.ps1'

      - name: Cloud source road centerline clearance audit V1
        shell: pwsh
        working-directory: asc-source
        run: |
          $ErrorActionPreference='Stop'
          & '.github/scripts/after-school-city-road-centerline-clearance-audit.ps1'

      - name: Prepare Rojo 7.7.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc-rojo"
          curl -fsSL 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip' -o "$RUNNER_TEMP/rojo.zip"
          unzip -q -o "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/asc-rojo"
          rojo=$(find "$RUNNER_TEMP/asc-rojo" -type f -name rojo | head -n1)
          [[ -n "$rojo" ]] || exit 20
          chmod +x "$rojo"
          version=$("$rojo" --version)
          echo "$version"
          [[ "$version" == *'7.7.0'* ]] || { echo "Wrong Rojo: $version"; exit 21; }
          echo "ROJO_EXE=$rojo" >> "$GITHUB_ENV"

      - name: Build exact After School City place
        shell: bash
        run: |
          set -euo pipefail
          place="$RUNNER_TEMP/after-school-city-v053.rbxl"
          "$ROJO_EXE" build 'asc-source/maps/after-school-city/default.project.json' -o "$place"
          test -f "$place"
          bytes=$(stat -c%s "$place"); (( bytes >= 1024 ))
          sha=$(sha256sum "$place" | awk '{print $1}')
          echo "PLACE_FILE=$place" >> "$GITHUB_ENV"
          echo "PLACE_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "PLACE_SHA256=$sha" >> "$GITHUB_ENV"
          echo "BUILD PASS bytes=$bytes sha256=$sha"

      - name: Publish Road Centerline Clearance v0.5.3 LIVE to Roblox
        shell: bash
        run: |
          set -euo pipefail
          url="https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published"
          http=$(curl -sS --location -o "$RUNNER_TEMP/asc-publish-response.json" -w '%{http_code}' -X POST "$url" -H "x-api-key: $ROBLOX_API_KEY" -H 'Content-Type: application/octet-stream' --data-binary "@$PLACE_FILE")
          body=$(cat "$RUNNER_TEMP/asc-publish-response.json")
          [[ "$http" =~ ^2[0-9][0-9]$ ]] || { echo "$body"; exit 30; }
          version=$(jq -r '.versionNumber // empty' "$RUNNER_TEMP/asc-publish-response.json")
          [[ -n "$version" ]] || { echo "Missing versionNumber: $body"; exit 31; }
          echo "PUBLISHED_VERSION=$version" >> "$GITHUB_ENV"
          echo "ROBLOX PUBLISH PASS version=$version"

      - name: Persist LIVE receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          jq -n --arg status 'LIVE_PUBLISHED' --arg project 'AFTER SCHOOL CITY' --arg mode 'ROAD_CENTERLINE_CLEARANCE_V0_5_3' --arg sourceRepo "$SOURCE_REPO" --arg sourceCommit "$SOURCE_SHA" --arg universeId "$UNIVERSE_ID" --arg placeId "$PLACE_ID" --arg versionNumber "$PUBLISHED_VERSION" --arg rojoVersion '7.7.0' --arg placeBytes "$PLACE_BYTES" --arg placeSha256 "$PLACE_SHA256" --arg runId "$GITHUB_RUN_ID" --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{status:$status,project:$project,mode:$mode,sourceRepo:$sourceRepo,sourceCommit:$sourceCommit,universeId:$universeId,placeId:$placeId,versionNumber:($versionNumber|tonumber),rojoVersion:$rojoVersion,placeBytes:($placeBytes|tonumber),placeSha256:$placeSha256,runId:$runId,publishedAt:$publishedAt,note:"Road Centerline Clearance v0.5.3; exact locked source; Spatial V4 + Orientation V1 + Visual Fidelity V1 + Runtime Reconcile V1 + Runtime Hard Cleanup V1 + Road Centerline Clearance V1 gates passed; dedication intro preserved."}' > deploy-status/after-school-city-publish-road-centerline-clearance-v0-5-3.json
          cat deploy-status/after-school-city-publish-road-centerline-clearance-v0-5-3.json
          git config user.name 'After School City Publish Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/after-school-city-publish-road-centerline-clearance-v0-5-3.json
          git commit -m "Record After School City Road Centerline Clearance publish v${PUBLISHED_VERSION} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
