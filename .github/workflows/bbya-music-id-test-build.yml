name: BBYA Music ID Test APK

on:
  push:
    branches:
      - feat/bbya-music-manager-mvp
    paths:
      - '.github/workflows/bbya-music-id-test-build.yml'
      - 'tools/bbya-music-manager/app/src/main/java/com/acc/bbyamusic/TestSeedProvider.java'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bbya-music-id-test-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark least-privilege ID test and isolate test map
        shell: bash
        run: |
          set -euo pipefail
          GRADLE="tools/bbya-music-manager/app/build.gradle"
          SYNC="tools/bbya-music-manager/app/src/main/java/com/acc/bbyamusic/OAuthSyncActivity.java"
          CLIENT="tools/bbya-music-manager/app/src/main/java/com/acc/bbyamusic/RobloxSyncClient.java"
          SEED="tools/bbya-music-manager/app/src/main/java/com/acc/bbyamusic/TestSeedProvider.java"
          sed -i 's/versionCode 11/versionCode 17/' "$GRADLE"
          sed -i "s/versionName '0.3.10-underground-sync-pilot'/versionName '0.3.16-id-test-ui-map'/" "$GRADLE"
          sed -i 's/openid profile asset:read asset:write universe-messaging-service:publish/openid universe-messaging-service:publish/g' "$SYNC" "$CLIENT"
          sed -i 's/private static final String UNIVERSE_ID = "8116636513";/private static final String UNIVERSE_ID = "10762005984";/' "$SYNC"
          sed -i 's/ke BBYA Social Hub/ke BBYA Music UI Test/' "$SYNC"
          sed -i 's/UNDERGROUND PILOT/ID TEST - BBYA MUSIC UI TEST/' "$SYNC"
          grep -q 'TestSeedProvider' tools/bbya-music-manager/app/src/main/AndroidManifest.xml
          grep -q '125820152354579' "$SEED"
          grep -q 'SCREENSHOT_ID_ISOLATED' "$SEED"
          grep -q 'private static final String UNIVERSE_ID = "10762005984";' "$SYNC"
          grep -q 'openid universe-messaging-service:publish' "$SYNC"
          ! grep -q 'openid profile' "$SYNC"
          grep -q "versionCode 17" "$GRADLE"
          echo "BBYA Music ID Test target: universe 10762005984 / place 124607344716828"
          echo "OAuth scope: openid + universe-messaging-service:publish only"
          echo "Underground catalog: exactly 25 pre-existing Roblox Asset IDs"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore explicit BBYA signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: .ci-signing/bbya-debug.keystore
          key: bbya-music-explicit-signing-v2

      - name: Create explicit BBYA signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .ci-signing
          keytool -genkeypair -v \
            -keystore .ci-signing/bbya-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=BBYA Music Dev,O=AM STUDIO,C=ID"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build BBYA Music ID test
        working-directory: tools/bbya-music-manager
        env:
          BBYA_KEYSTORE_PATH: ${{ github.workspace }}/.ci-signing/bbya-debug.keystore
        run: gradle assembleDebug --stacktrace

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="${GITHUB_WORKSPACE}/.ci-signing/bbya-debug.keystore"
          APK="tools/bbya-music-manager/app/build/outputs/apk/debug/app-debug.apk"
          KEY_SHA=$(keytool -exportcert -alias androiddebugkey -keystore "$KEYSTORE" -storepass android | sha256sum | awk '{print $1}')
          APK_SHA=$("${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | head -n1)
          echo "Keystore cert SHA256: ${KEY_SHA}"
          echo "APK signer SHA256: ${APK_SHA}"
          test -n "$APK_SHA"
          test "$KEY_SHA" = "$APK_SHA"

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp tools/bbya-music-manager/app/build/outputs/apk/debug/app-debug.apk dist/BBYA-Music-Manager-v0.3.16-ID-Test-UIMap.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BBYA-Music-Manager-v0.3.16-ID-Test-UIMap
          path: dist/BBYA-Music-Manager-v0.3.16-ID-Test-UIMap.apk
          if-no-files-found: error
          retention-days: 7
