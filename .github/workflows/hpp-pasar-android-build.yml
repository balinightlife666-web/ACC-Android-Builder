name: HPP Pasar Android Build

on:
  pull_request:
    paths:
      - 'projects/hpp-pasar/android/**'
      - '.github/workflows/hpp-pasar-android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/hpp-pasar/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hpp-pasar-debug-apk
          path: projects/hpp-pasar/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
