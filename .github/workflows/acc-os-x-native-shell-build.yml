name: ACC OS X Native Shell APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/acc-os-x-shell/**"
      - ".github/workflows/acc-os-x-native-shell-build.yml"
      - ".acc-os-x-shell-trigger"

permissions:
  contents: write

concurrency:
  group: acc-os-x-native-shell
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build ACC OS X APK
        working-directory: tools/acc-os-x-shell
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp tools/acc-os-x-shell/app/build/outputs/apk/debug/app-debug.apk dist/ACC-OS-X-Launcher-v1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ACC-OS-X-Launcher-v1
          path: dist/ACC-OS-X-Launcher-v1.apk
          retention-days: 30

      - name: Publish latest direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete acc-os-x-launcher-latest --cleanup-tag -y || true
          gh release create acc-os-x-launcher-latest \
            dist/ACC-OS-X-Launcher-v1.apk \
            --target "$GITHUB_SHA" \
            --title "ACC OS X · Native Launcher v1" \
            --notes "Native ACC OS X shell with package-launch bridge for the owner's installed ACC Android apps."
