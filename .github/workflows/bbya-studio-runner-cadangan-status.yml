name: BBYA Studio Runner Cadangan Status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bbya-studio-runner-cadangan-status.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect cadangan runner registration and recent runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          H=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          runs=$(curl -fsSL "${H[@]}" "https://api.github.com/repos/$REPO/actions/runs?per_page=30")
          runners=$(curl -sSL "${H[@]}" "https://api.github.com/repos/$REPO/actions/runners?per_page=100")
          mkdir -p deploy-status
          python3 - "$runs" "$runners" <<'PY' > deploy-status/bbya-studio-runner-cadangan-status.json
          import json,sys,time
          runs=json.loads(sys.argv[1]);runners=json.loads(sys.argv[2])
          out={'recordedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'runnersResponse':runners,'recentRuns':[]}
          for x in runs.get('workflow_runs',[]):
            if 'Studio Runner Cadangan' in x.get('name','') or 'Mall' in x.get('name',''):
              out['recentRuns'].append({k:x.get(k) for k in ('id','name','status','conclusion','event','head_sha','created_at','updated_at')})
          print(json.dumps(out,indent=2))
          PY
          cat deploy-status/bbya-studio-runner-cadangan-status.json
          git config user.name 'BBYA Cadangan Status'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/bbya-studio-runner-cadangan-status.json
          git commit -m 'Record BBYA cadangan runner status [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main
