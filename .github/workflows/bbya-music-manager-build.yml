name: BBYA Music Manager APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bbya-music-manager-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build BBYA Music Manager
        working-directory: tools/bbya-music-manager
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp tools/bbya-music-manager/app/build/outputs/apk/debug/app-debug.apk dist/BBYA-Music-Manager-MVP.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BBYA-Music-Manager-MVP
          path: dist/BBYA-Music-Manager-MVP.apk
          if-no-files-found: error
          retention-days: 30
