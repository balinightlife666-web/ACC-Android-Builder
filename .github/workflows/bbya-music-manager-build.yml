name: BBYA Music Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/bbya-music-manager-mvp

permissions:
  contents: read

concurrency:
  group: bbya-music-manager-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch OAuth and BBYA creator target
        shell: bash
        run: |
          set -euo pipefail
          FILE="tools/bbya-music-manager/app/src/main/java/com/acc/bbyamusic/OAuthSyncActivity.java"
          sed -i 's/openid profile asset:read asset:write universe-messaging-service:publish/openid asset:read asset:write universe-messaging-service:publish/' "$FILE"
          sed -i 's/appendQueryParameter("prompt", "login consent")/appendQueryParameter("prompt", "consent select_account")/' "$FILE"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tools/bbya-music-manager/app/src/main/java/com/acc/bbyamusic/OAuthSyncActivity.java")
          s = p.read_text()
          old = 'JSONObject creator = new JSONObject();\n        creator.put("userId", userId);'
          new = 'JSONObject creator = CreatorResolver.resolveUniverseCreator(UNIVERSE_ID, userId);'
          if old not in s:
              raise SystemExit("creator block not found")
          p.write_text(s.replace(old, new, 1))
          PY
          grep -q 'openid asset:read asset:write universe-messaging-service:publish' "$FILE"
          grep -q 'appendQueryParameter("prompt", "consent select_account")' "$FILE"
          grep -q 'CreatorResolver.resolveUniverseCreator(UNIVERSE_ID, userId)' "$FILE"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable debug signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bbya-music-debug-signing-v1

      - name: Create stable debug signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=BBYA Music Dev,O=AM STUDIO,C=ID"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build BBYA Music Manager
        working-directory: tools/bbya-music-manager
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp tools/bbya-music-manager/app/build/outputs/apk/debug/app-debug.apk dist/BBYA-Music-Manager-v0.3.7.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BBYA-Music-Manager-v0.3.7
          path: dist/BBYA-Music-Manager-v0.3.7.apk
          if-no-files-found: error
          retention-days: 30
