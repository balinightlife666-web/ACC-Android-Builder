name: BBYA Music Manager APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bbya-music-manager-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch OAuth, creator target, sync progress and Roblox audio limits
        shell: bash
        run: |
          set -euo pipefail
          FILE="tools/bbya-music-manager/app/src/main/java/com/acc/bbyamusic/OAuthSyncActivity.java"
          sed -i 's/openid profile asset:read asset:write universe-messaging-service:publish/openid asset:read asset:write universe-messaging-service:publish/' "$FILE"
          sed -i 's/appendQueryParameter("prompt", "login consent")/appendQueryParameter("prompt", "consent select_account")/' "$FILE"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tools/bbya-music-manager/app/src/main/java/com/acc/bbyamusic/OAuthSyncActivity.java")
          s = p.read_text()
          if 'import android.media.MediaMetadataRetriever;' not in s:
              s = s.replace('import android.net.Uri;\n', 'import android.net.Uri;\nimport android.media.MediaMetadataRetriever;\n', 1)
          old = 'JSONObject creator = new JSONObject();\n        creator.put("userId", userId);'
          new = 'JSONObject creator = CreatorResolver.resolveUniverseCreator(UNIVERSE_ID, userId);'
          if old in s:
              s = s.replace(old, new, 1)
          marker = 'HttpResponse create = request("POST", ASSET_CREATE_URL, accessToken, "multipart/form-data; boundary=" + boundary, body.toByteArray());'
          if 'Upload ke Roblox: ' not in s:
              s = s.replace(marker, 'setStatusFromThread("Upload ke Roblox: " + title + " ...");\n        ' + marker, 1)
          marker2 = 'String operationId = operationPath.substring("operations/".length());'
          if 'Roblox menerima file. Memproses:' not in s:
              s = s.replace(marker2, marker2 + '\n        setStatusFromThread("Roblox menerima file. Memproses: " + title);', 1)
          oldpoll = 'for (int attempt = 1; attempt <= 36; attempt++) {\n            Thread.sleep(5000L);'
          newpoll = 'for (int attempt = 1; attempt <= 36; attempt++) {\n            setStatusFromThread("Roblox processing: " + title + " (" + attempt + "/36)");\n            Thread.sleep(5000L);'
          if oldpoll in s:
              s = s.replace(oldpoll, newpoll, 1)
          oldreturn = 'boolean approved = "MODERATION_STATE_APPROVED".equals(moderation) || "APPROVED".equals(moderation);\n            return new UploadResult(assetId, moderation, approved);'
          newreturn = 'boolean approved = "MODERATION_STATE_APPROVED".equals(moderation) || "APPROVED".equals(moderation);\n            setStatusFromThread("Roblox selesai: " + title + " • " + moderation);\n            return new UploadResult(assetId, moderation, approved);'
          if oldreturn in s:
              s = s.replace(oldreturn, newreturn, 1)
          publish = 'publishDelta(access, delta);'
          if 'Mengirim ke Underground:' not in s:
              s = s.replace(publish, 'setStatusFromThread("Mengirim ke Underground: " + track.optString("title", "Track"));\n                    ' + publish, 1)
          if 'int skippedTooLong = 0;' not in s:
              s = s.replace('int synced = 0;\n                int pending = 0;', 'int synced = 0;\n                int pending = 0;\n                int skippedTooLong = 0;', 1)
          duration_guard_anchor = 'String assetId = track.optString("robloxAssetId", "");\n                    if (assetId.isEmpty()) {'
          duration_guard = 'String assetId = track.optString("robloxAssetId", "");\n                    long durationMs = getAudioDurationMs(track.optString("localPath", ""));\n                    if (durationMs > 7L * 60L * 1000L) {\n                        track.put("uploadState", "TOO_LONG");\n                        track.put("syncState", "SKIPPED_TOO_LONG");\n                        skippedTooLong++;\n                        persistCatalog(catalog);\n                        setStatusFromThread("Dilewati >7 menit: " + track.optString("title", "Track") + " • " + formatDuration(durationMs));\n                        continue;\n                    }\n                    if (assetId.isEmpty()) {'
          if 'SKIPPED_TOO_LONG' not in s and duration_guard_anchor in s:
              s = s.replace(duration_guard_anchor, duration_guard, 1)
          old_msg = 'String msg = pending == 0\n                        ? "SYNCED ✓ " + synced + " lagu Underground dikirim ke Roblox."\n                        : "Sync sebagian: " + synced + " siap, " + pending + " masih menunggu Roblox/moderasi.";'
          new_msg = 'String msg;\n                if (pending == 0 && skippedTooLong == 0) {\n                    msg = "SYNCED ✓ " + synced + " lagu Underground dikirim ke Roblox.";\n                } else {\n                    msg = "Sync selesai: " + synced + " siap, " + pending + " menunggu Roblox/moderasi, " + skippedTooLong + " dilewati karena >7 menit.";\n                }'
          if old_msg in s:
              s = s.replace(old_msg, new_msg, 1)
          method_anchor = '    private void publishDelta(String accessToken, JSONObject delta) throws Exception {'
          duration_methods = '    private long getAudioDurationMs(String path) {\n        if (path == null || path.isEmpty()) return 0L;\n        MediaMetadataRetriever retriever = new MediaMetadataRetriever();\n        try {\n            retriever.setDataSource(path);\n            String raw = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION);\n            return raw == null || raw.isEmpty() ? 0L : Long.parseLong(raw);\n        } catch (Exception ignored) {\n            return 0L;\n        } finally {\n            try { retriever.release(); } catch (Exception ignored) {}\n        }\n    }\n\n    private String formatDuration(long durationMs) {\n        long totalSeconds = Math.max(0L, durationMs / 1000L);\n        return String.format(Locale.US, "%d:%02d", totalSeconds / 60L, totalSeconds % 60L);\n    }\n\n'
          if 'private long getAudioDurationMs(' not in s and method_anchor in s:
              s = s.replace(method_anchor, duration_methods + method_anchor, 1)
          p.write_text(s)
          PY
          grep -q 'openid asset:read asset:write universe-messaging-service:publish' "$FILE"
          grep -q 'appendQueryParameter("prompt", "consent select_account")' "$FILE"
          grep -q 'CreatorResolver.resolveUniverseCreator(UNIVERSE_ID, userId)' "$FILE"
          grep -q 'Roblox processing:' "$FILE"
          grep -q 'SKIPPED_TOO_LONG' "$FILE"
          grep -q 'getAudioDurationMs' "$FILE"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore explicit BBYA signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: .ci-signing/bbya-debug.keystore
          key: bbya-music-explicit-signing-v2

      - name: Create explicit BBYA signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .ci-signing
          keytool -genkeypair -v \
            -keystore .ci-signing/bbya-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=BBYA Music Dev,O=AM STUDIO,C=ID"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build BBYA Music Manager
        working-directory: tools/bbya-music-manager
        env:
          BBYA_KEYSTORE_PATH: ${{ github.workspace }}/.ci-signing/bbya-debug.keystore
        run: gradle assembleDebug --stacktrace

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="${GITHUB_WORKSPACE}/.ci-signing/bbya-debug.keystore"
          APK="tools/bbya-music-manager/app/build/outputs/apk/debug/app-debug.apk"
          KEY_SHA=$(keytool -exportcert -alias androiddebugkey -keystore "$KEYSTORE" -storepass android | sha256sum | awk '{print $1}')
          APK_SHA=$("${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | head -n1)
          echo "Keystore cert SHA256: ${KEY_SHA}"
          echo "APK signer SHA256: ${APK_SHA}"
          test -n "$APK_SHA"
          test "$KEY_SHA" = "$APK_SHA"

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp tools/bbya-music-manager/app/build/outputs/apk/debug/app-debug.apk dist/BBYA-Music-Manager-v0.3.10.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BBYA-Music-Manager-v0.3.10
          path: dist/BBYA-Music-Manager-v0.3.10.apk
          if-no-files-found: error
          retention-days: 30
