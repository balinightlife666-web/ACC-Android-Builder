name: BBYA Music Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/bbya-music-manager-mvp

permissions:
  contents: read

concurrency:
  group: bbya-music-manager-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch OAuth, BBYA creator target and sync progress
        shell: bash
        run: |
          set -euo pipefail
          FILE="tools/bbya-music-manager/app/src/main/java/com/acc/bbyamusic/OAuthSyncActivity.java"
          sed -i 's/openid profile asset:read asset:write universe-messaging-service:publish/openid asset:read asset:write universe-messaging-service:publish/' "$FILE"
          sed -i 's/appendQueryParameter("prompt", "login consent")/appendQueryParameter("prompt", "consent select_account")/' "$FILE"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tools/bbya-music-manager/app/src/main/java/com/acc/bbyamusic/OAuthSyncActivity.java")
          s = p.read_text()

          old = 'JSONObject creator = new JSONObject();\n        creator.put("userId", userId);'
          new = 'JSONObject creator = CreatorResolver.resolveUniverseCreator(UNIVERSE_ID, userId);'
          if old in s:
              s = s.replace(old, new, 1)

          marker = 'HttpResponse create = request("POST", ASSET_CREATE_URL, accessToken, "multipart/form-data; boundary=" + boundary, body.toByteArray());'
          if 'Upload ke Roblox: ' not in s:
              s = s.replace(marker, 'setStatusFromThread("Upload ke Roblox: " + title + " ...");\n        ' + marker, 1)

          marker2 = 'String operationId = operationPath.substring("operations/".length());'
          if 'Roblox menerima file. Memproses:' not in s:
              s = s.replace(marker2, marker2 + '\n        setStatusFromThread("Roblox menerima file. Memproses: " + title);', 1)

          oldpoll = 'for (int attempt = 1; attempt <= 36; attempt++) {\n            Thread.sleep(5000L);'
          newpoll = 'for (int attempt = 1; attempt <= 36; attempt++) {\n            setStatusFromThread("Roblox processing: " + title + " (" + attempt + "/36)");\n            Thread.sleep(5000L);'
          if oldpoll in s:
              s = s.replace(oldpoll, newpoll, 1)

          oldreturn = 'boolean approved = "MODERATION_STATE_APPROVED".equals(moderation) || "APPROVED".equals(moderation);\n            return new UploadResult(assetId, moderation, approved);'
          newreturn = 'boolean approved = "MODERATION_STATE_APPROVED".equals(moderation) || "APPROVED".equals(moderation);\n            setStatusFromThread("Roblox selesai: " + title + " • " + moderation);\n            return new UploadResult(assetId, moderation, approved);'
          if oldreturn in s:
              s = s.replace(oldreturn, newreturn, 1)

          publish = 'publishDelta(access, delta);'
          if 'Mengirim ke Underground:' not in s:
              s = s.replace(publish, 'setStatusFromThread("Mengirim ke Underground: " + track.optString("title", "Track"));\n                    ' + publish, 1)

          p.write_text(s)
          PY
          grep -q 'openid asset:read asset:write universe-messaging-service:publish' "$FILE"
          grep -q 'appendQueryParameter("prompt", "consent select_account")' "$FILE"
          grep -q 'CreatorResolver.resolveUniverseCreator(UNIVERSE_ID, userId)' "$FILE"
          grep -q 'Roblox processing:' "$FILE"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore explicit BBYA signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: .ci-signing/bbya-debug.keystore
          key: bbya-music-explicit-signing-v2

      - name: Create explicit BBYA signing key
        if: steps.signing-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .ci-signing
          keytool -genkeypair -v \
            -keystore .ci-signing/bbya-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=BBYA Music Dev,O=AM STUDIO,C=ID"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build BBYA Music Manager
        working-directory: tools/bbya-music-manager
        env:
          BBYA_KEYSTORE_PATH: ${{ github.workspace }}/.ci-signing/bbya-debug.keystore
        run: gradle assembleDebug --stacktrace

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="${GITHUB_WORKSPACE}/.ci-signing/bbya-debug.keystore"
          APK="tools/bbya-music-manager/app/build/outputs/apk/debug/app-debug.apk"
          KEY_SHA=$(keytool -exportcert -alias androiddebugkey -keystore "$KEYSTORE" -storepass android | sha256sum | awk '{print $1}')
          APK_SHA=$("${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | head -n1)
          echo "Keystore cert SHA256: ${KEY_SHA}"
          echo "APK signer SHA256: ${APK_SHA}"
          test -n "$APK_SHA"
          test "$KEY_SHA" = "$APK_SHA"

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp tools/bbya-music-manager/app/build/outputs/apk/debug/app-debug.apk dist/BBYA-Music-Manager-v0.3.9.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BBYA-Music-Manager-v0.3.9
          path: dist/BBYA-Music-Manager-v0.3.9.apk
          if-no-files-found: error
          retention-days: 30
