# Owner-approved AFTER SCHOOL CITY Student Row Interiors + Road Concrete Strip Cleanup v0.8.1 LIVE publish
name: After School City Publish Student Row Road Cleanup V0.8.1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/after-school-city-publish-v081-student-row-road-cleanup.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: after-school-city-live-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REPO: ardarawk-cloud/ACC-Roblox-maps
      SOURCE_SHA: efa281ac26f847f683e002b6085b49d196c05421
      BASE_LIVE_SHA: c6f0f836d69ddbb8648765b6647709447c3ea8fa
      QC_RUN_ID: '33267677266'
      UNIVERSE_ID: '10745359869'
      PLACE_ID: '121603385909425'
      EXPECTED_BYTES: '108466'
      EXPECTED_SHA256: '937a0b365d402e4ea2fa86a7f8601a3bb7891682d64cc65607d355a5920da5e2'
      ROBLOX_API_KEY: ${{ secrets.ROCKET_RACOON_PUBLISH }}
    steps:
      - name: Checkout publisher repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify canonical V0.8.1 QC receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt='deploy-status/after-school-city-v081-student-row-road-cleanup-qc.json'
          test -f "$receipt"
          [[ "$(jq -r '.status' "$receipt")" == 'QC_PASS' ]] || { echo 'Canonical QC is not PASS'; exit 9; }
          [[ "$(jq -r '.sourceCommit' "$receipt")" == "$SOURCE_SHA" ]] || { echo 'QC source mismatch'; exit 10; }
          [[ "$(jq -r '.baseLiveCommit' "$receipt")" == "$BASE_LIVE_SHA" ]] || { echo 'QC base LIVE mismatch'; exit 11; }
          [[ "$(jq -r '.runId' "$receipt")" == "$QC_RUN_ID" ]] || { echo 'QC run mismatch'; exit 12; }
          [[ "$(jq -r '.placeBytes' "$receipt")" == "$EXPECTED_BYTES" ]] || { echo 'QC byte mismatch'; exit 13; }
          [[ "$(jq -r '.placeSha256' "$receipt")" == "$EXPECTED_SHA256" ]] || { echo 'QC SHA mismatch'; exit 14; }
          echo "QC AUTHORITY PASS run=$QC_RUN_ID source=$SOURCE_SHA"

      - name: Checkout locked After School City source
        uses: actions/checkout@v4
        with:
          repository: ardarawk-cloud/ACC-Roblox-maps
          ref: efa281ac26f847f683e002b6085b49d196c05421
          token: ${{ secrets.ACC_ROBLOX_MAPS_WRITE_TOKEN }}
          path: asc-source
          fetch-depth: 0

      - name: Verify exact V0.8.1 source and delta
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ROBLOX_API_KEY:-}" ]] || { echo 'ROCKET_RACOON_PUBLISH missing'; exit 20; }
          actual=$(git -C asc-source rev-parse HEAD)
          [[ "$actual" == "$SOURCE_SHA" ]] || { echo "Source SHA mismatch: $actual"; exit 21; }
          git -C asc-source cat-file -e "${BASE_LIVE_SHA}^{commit}"
          mapfile -t files < <(git -C asc-source diff --name-only "$BASE_LIVE_SHA" "$SOURCE_SHA")
          [[ ${#files[@]} -eq 5 ]] || { printf '%s\n' "${files[@]}"; echo "Unexpected delta count ${#files[@]}"; exit 22; }
          expected=(
            'maps/after-school-city/after-school-city.config.lua'
            'maps/after-school-city/after-school-city.road-concrete-strip-cleanup.server.lua'
            'maps/after-school-city/after-school-city.student-row-interior-sign-finalize.server.lua'
            'maps/after-school-city/after-school-city.student-row-shop-interiors.server.lua'
            'maps/after-school-city/default.project.json'
          )
          for f in "${expected[@]}"; do printf '%s\n' "${files[@]}" | grep -Fxq "$f" || { echo "Missing expected delta $f"; exit 23; }; done
          echo "SOURCE LOCK PASS source=$actual delta=5-files"

      - name: Audit V0.8.1 interiors and asphalt-priority cleanup
        shell: pwsh
        working-directory: asc-source
        run: |
          $ErrorActionPreference='Stop'
          $map='maps/after-school-city'
          $interiors=Get-Content "$map/after-school-city.student-row-shop-interiors.server.lua" -Raw
          $signFinalize=Get-Content "$map/after-school-city.student-row-interior-sign-finalize.server.lua" -Raw
          $roadFix=Get-Content "$map/after-school-city.road-concrete-strip-cleanup.server.lua" -Raw
          $streetLife=Get-Content "$map/after-school-city.street-life.server.lua" -Raw
          $config=Get-Content "$map/after-school-city.config.lua" -Raw
          $project=Get-Content "$map/default.project.json" -Raw
          $null=$project|ConvertFrom-Json
          function Need([string]$text,[string]$token,[string]$label){if($text.IndexOf($token,[StringComparison]::Ordinal)-lt 0){throw "V0.8.1 missing contract: $label"}}
          foreach($token in @('0.8.0-student-row-shop-interiors-1','StudentMiniMart','StudyLounge','CommunityLibrary','ARCADE','CAFE','STYLE','MUSIC','HOBBY','ASC_V080WalkInInterior','ASC_StudentRowShopInteriorsPass')){Need $interiors $token $token}
          Need $signFinalize 'ASC_StudentRowInteriorSignFinalizePass' 'sign-finalize completion authority'
          Need $signFinalize 'Enum.NormalId.Back' 'back-wall signs face inward'
          foreach($token in @('0.8.1-road-concrete-strip-cleanup-1','ASC_StudentRowInteriorSignFinalizePass','CrossSidewalkN','CrossSidewalkS','child.Size.X >= 200','child:Destroy()','Vector3.new(75, 0.55, 5.2)','sidewalkSegment("CrossStreetSidewalkWest", -67.5, z)','sidewalkSegment("CrossStreetSidewalkEast", 67.5, z)','ASC_AsphaltVisualPriority','ASC_RoadConcreteStripCleanupPass')){Need $roadFix $token $token}
          Need $streetLife 'part(streetGrid, "CrossSidewalkN", Vector3.new(280, 0.65, 6)' 'legacy 280-stud north strip authority'
          Need $streetLife 'part(streetGrid, "CrossSidewalkS", Vector3.new(280, 0.65, 6)' 'legacy 280-stud south strip authority'
          foreach($forbidden in @('MarketplaceService','PromptProductPurchase','ProcessReceipt','DataStoreService','BillboardGui')){
            if($interiors -match [regex]::Escape($forbidden)){throw "Forbidden interiors token: $forbidden"}
            if($roadFix -match [regex]::Escape($forbidden)){throw "Forbidden road cleanup token: $forbidden"}
          }
          foreach($token in @('Version = "0.8.1-road-concrete-strip-cleanup-1"','StudentRowShopInteriorsVersion = "0.8.0-student-row-shop-interiors-1"','RoadConcreteStripCleanupVersion = "0.8.1-road-concrete-strip-cleanup-1"','EnableStudentRowShopInteriorsPass = true','EnableRoadConcreteStripCleanupPass = true','EnableActivities = false','EnableEconomy = false','EnablePersistence = false','EnablePersonalRoom = false','EnableClubs = false')){Need $config $token $token}
          Need $project 'ASC_StudentRowShopInteriors' 'V0.8 interiors node'
          Need $project 'ASC_StudentRowInteriorSignFinalize' 'V0.8 sign finalize node'
          Need $project 'ASC_RoadConcreteStripCleanup' 'V0.8.1 road cleanup node'
          $i80=$project.IndexOf('ASC_StudentRowShopInteriors',[StringComparison]::Ordinal)
          $i80s=$project.IndexOf('ASC_StudentRowInteriorSignFinalize',[StringComparison]::Ordinal)
          $i81=$project.IndexOf('ASC_RoadConcreteStripCleanup',[StringComparison]::Ordinal)
          if($i80 -lt 0 -or $i80s -le $i80 -or $i81 -le $i80s){throw 'Rojo ordering invalid: interiors -> sign finalize -> road cleanup required'}
          Write-Host 'V0.8.1 CONTRACT PASS interiors=8-targets asphaltPriority=ON economy/gameplay=OFF'

      - name: Verify LIVE v27 protected source unchanged
        shell: bash
        working-directory: asc-source
        run: |
          set -euo pipefail
          for f in \
            maps/after-school-city/after-school-city.intro.client.lua \
            maps/after-school-city/after-school-city.world.server.lua \
            maps/after-school-city/after-school-city.school-life.server.lua \
            maps/after-school-city/after-school-city.street-life.server.lua \
            maps/after-school-city/after-school-city.spatial-cleanup.server.lua \
            maps/after-school-city/after-school-city.layout-correction.server.lua \
            maps/after-school-city/after-school-city.circulation-sanitize.server.lua \
            maps/after-school-city/after-school-city.orientation-correction.server.lua \
            maps/after-school-city/after-school-city.road-centerline-clearance.server.lua \
            maps/after-school-city/after-school-city.premium-exterior.server.lua \
            maps/after-school-city/after-school-city.school-interior.server.lua \
            maps/after-school-city/after-school-city.school-interior-polish.server.lua \
            maps/after-school-city/after-school-city.school-visual-depth.server.lua \
            maps/after-school-city/after-school-city.signage-orientation-hotfix.server.lua \
            maps/after-school-city/after-school-city.school-architectural-cleanup.server.lua \
            maps/after-school-city/after-school-city.locker-clearance-hotfix.server.lua \
            maps/after-school-city/after-school-city.exterior-locker-cleanup.server.lua \
            maps/after-school-city/after-school-city.school-road-visual-defect-cleanup.server.lua; do
            git diff --quiet "$BASE_LIVE_SHA" "$SOURCE_SHA" -- "$f" || { echo "Protected source changed: $f"; exit 30; }
          done
          grep -Fq 'PUTU AZYA PUTRI' maps/after-school-city/after-school-city.intro.client.lua
          grep -Fq 'BINTANG HARDAJAYA' maps/after-school-city/after-school-city.intro.client.lua
          grep -Fq 'WITH LOVE, DAD' maps/after-school-city/after-school-city.intro.client.lua
          echo 'PROTECTED SOURCE PASS v27=UNCHANGED roadAuthority=UNCHANGED streetLifeAuthority=UNCHANGED dedication=UNCHANGED'

      - name: Prepare Rojo 7.7.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc-rojo"
          curl -fsSL 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip' -o "$RUNNER_TEMP/rojo.zip"
          unzip -q -o "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/asc-rojo"
          rojo=$(find "$RUNNER_TEMP/asc-rojo" -type f -name rojo | head -n1)
          [[ -n "$rojo" ]] || exit 40
          chmod +x "$rojo"
          version=$("$rojo" --version)
          [[ "$version" == *'7.7.0'* ]] || { echo "Wrong Rojo: $version"; exit 41; }
          echo "ROJO_EXE=$rojo" >> "$GITHUB_ENV"

      - name: Build and verify exact V0.8.1 place
        shell: bash
        run: |
          set -euo pipefail
          place="$RUNNER_TEMP/after-school-city-v081.rbxl"
          "$ROJO_EXE" build 'asc-source/maps/after-school-city/default.project.json' -o "$place"
          test -f "$place"
          bytes=$(stat -c%s "$place")
          sha=$(sha256sum "$place" | awk '{print $1}')
          [[ "$bytes" == "$EXPECTED_BYTES" ]] || { echo "Byte mismatch: $bytes expected=$EXPECTED_BYTES"; exit 42; }
          [[ "$sha" == "$EXPECTED_SHA256" ]] || { echo "SHA256 mismatch: $sha expected=$EXPECTED_SHA256"; exit 43; }
          echo "PLACE_FILE=$place" >> "$GITHUB_ENV"
          echo "PLACE_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "PLACE_SHA256=$sha" >> "$GITHUB_ENV"
          echo "BUILD EXACT PASS bytes=$bytes sha256=$sha"

      - name: Publish Student Row Interiors Road Cleanup v0.8.1 LIVE to Roblox
        shell: bash
        run: |
          set -euo pipefail
          url="https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published"
          http=$(curl -sS --location -o "$RUNNER_TEMP/asc-publish-response.json" -w '%{http_code}' -X POST "$url" -H "x-api-key: $ROBLOX_API_KEY" -H 'Content-Type: application/octet-stream' --data-binary "@$PLACE_FILE")
          body=$(cat "$RUNNER_TEMP/asc-publish-response.json")
          [[ "$http" =~ ^2[0-9][0-9]$ ]] || { echo "HTTP $http: $body"; exit 50; }
          version=$(jq -r '.versionNumber // empty' "$RUNNER_TEMP/asc-publish-response.json")
          [[ -n "$version" ]] || { echo "Missing versionNumber: $body"; exit 51; }
          echo "PUBLISHED_VERSION=$version" >> "$GITHUB_ENV"
          echo "ROBLOX PUBLISH PASS version=$version"

      - name: Persist LIVE receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          jq -n \
            --arg status 'LIVE_PUBLISHED' \
            --arg project 'AFTER SCHOOL CITY' \
            --arg mode 'STUDENT_ROW_INTERIORS_ROAD_CLEANUP_V0_8_1' \
            --arg sourceRepo "$SOURCE_REPO" \
            --arg sourceCommit "$SOURCE_SHA" \
            --arg baseLiveCommit "$BASE_LIVE_SHA" \
            --arg qcRunId "$QC_RUN_ID" \
            --arg universeId "$UNIVERSE_ID" \
            --arg placeId "$PLACE_ID" \
            --arg versionNumber "$PUBLISHED_VERSION" \
            --arg rojoVersion '7.7.0' \
            --arg placeBytes "$PLACE_BYTES" \
            --arg placeSha256 "$PLACE_SHA256" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,project:$project,mode:$mode,sourceRepo:$sourceRepo,sourceCommit:$sourceCommit,baseLiveCommit:$baseLiveCommit,qcRunId:$qcRunId,universeId:$universeId,placeId:$placeId,versionNumber:($versionNumber|tonumber),rojoVersion:$rojoVersion,placeBytes:($placeBytes|tonumber),placeSha256:$placeSha256,runId:$runId,publishedAt:$publishedAt,note:"Student Row + Shop Interiors v0.8.0 plus Road Concrete Strip Cleanup v0.8.1 exact QC-locked source; 8 walk-in target interiors; internal signage finalized inward; four legacy 280-stud concrete strips removed; compact sidewalk edge segments restored only around surviving cross street; protected LIVE v27 source unchanged."}' \
            > deploy-status/after-school-city-publish-student-row-road-cleanup-v0-8-1.json
          cat deploy-status/after-school-city-publish-student-row-road-cleanup-v0-8-1.json
          git config user.name 'After School City Publish Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/after-school-city-publish-student-row-road-cleanup-v0-8-1.json
          git commit -m "Record After School City V0.8.1 student row road cleanup publish v${PUBLISHED_VERSION} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
