# Owner-approved AFTER SCHOOL CITY School Interior v0.7 LIVE publish
name: After School City Publish School Interior V0.7

on:
  push:
    branches: [main]
    paths: ['.github/workflows/after-school-city-publish-v070-school-interior.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: after-school-city-live-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_REPO: ardarawk-cloud/ACC-Roblox-maps
      SOURCE_SHA: dcaa53170892974af7704423cb4fdc9e2ee25a1f
      UNIVERSE_ID: '10745359869'
      PLACE_ID: '121603385909425'
      EXPECTED_BYTES: '76573'
      EXPECTED_SHA256: '3e97e34b0a0cfec873c86e690442cb51b163d9a88d4d2be79dce64f414e568cd'
      ROBLOX_API_KEY: ${{ secrets.ROCKET_RACOON_PUBLISH }}
    steps:
      - name: Checkout publisher repository
        uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Checkout locked After School City source
        uses: actions/checkout@v4
        with:
          repository: ardarawk-cloud/ACC-Roblox-maps
          ref: dcaa53170892974af7704423cb4fdc9e2ee25a1f
          token: ${{ secrets.ACC_ROBLOX_MAPS_WRITE_TOKEN }}
          path: asc-source
          fetch-depth: 1

      - name: Verify exact V0.7 source and authority
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ROBLOX_API_KEY:-}" ]] || { echo 'ROCKET_RACOON_PUBLISH missing'; exit 10; }
          actual=$(git -C asc-source rev-parse HEAD)
          [[ "$actual" == "$SOURCE_SHA" ]] || { echo "Source SHA mismatch: $actual"; exit 11; }
          project='asc-source/maps/after-school-city/default.project.json'
          intro='asc-source/maps/after-school-city/after-school-city.intro.client.lua'
          config='asc-source/maps/after-school-city/after-school-city.config.lua'
          interior='asc-source/maps/after-school-city/after-school-city.school-interior.server.lua'
          jq -e . "$project" >/dev/null
          for token in 'ASC_RoadCenterlineClearance' 'ASC_PremiumExterior' 'ASC_SchoolInterior' 'after-school-city.school-interior.server.lua'; do grep -Fq "$token" "$project"; done
          for token in 'PUTU AZYA PUTRI' 'BINTANG HARDAJAYA' 'WITH LOVE, DAD' 'ENTER THE CITY'; do grep -Fq "$token" "$intro"; done
          for token in 'Version = "0.7.0-school-interior-1"' 'SchoolInteriorVersion = "0.7.0-school-interior-1"' 'EnableSchoolInteriorPass = true' 'EnableActivities = false' 'EnableEconomy = false' 'EnablePersistence = false' 'EnableClubs = false'; do grep -Fq "$token" "$config"; done
          for token in 'V070_SchoolInterior' 'ASC_SchoolInteriorPass' 'ASC_SchoolInteriorAccessible' 'ASC_SchoolExteriorEnvelopePreserved' 'SchoolToilets'; do grep -Fq "$token" "$interior"; done
          if grep -Eq 'MarketplaceService|PromptProductPurchase|ProcessReceipt|DataStoreService|BillboardGui' "$interior"; then
            echo 'Forbidden monetization/persistence/debug marker in V0.7 school interior layer'
            exit 12
          fi
          echo "LOCK PASS source=$actual school_interior_v0_7=PASS dedication=PASS"

      - name: V0.7 prior regression gates
        shell: pwsh
        working-directory: asc-source
        run: |
          $ErrorActionPreference='Stop'
          & '.github/scripts/after-school-city-v070-prior-gates.ps1'

      - name: School Interior Audit V1
        shell: pwsh
        working-directory: asc-source
        run: |
          $ErrorActionPreference='Stop'
          & '.github/scripts/after-school-city-school-interior-audit.ps1'

      - name: Prepare Rojo 7.7.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc-rojo"
          curl -fsSL 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip' -o "$RUNNER_TEMP/rojo.zip"
          unzip -q -o "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/asc-rojo"
          rojo=$(find "$RUNNER_TEMP/asc-rojo" -type f -name rojo | head -n1)
          [[ -n "$rojo" ]] || exit 20
          chmod +x "$rojo"
          version=$("$rojo" --version)
          echo "$version"
          [[ "$version" == *'7.7.0'* ]] || { echo "Wrong Rojo: $version"; exit 21; }
          echo "ROJO_EXE=$rojo" >> "$GITHUB_ENV"

      - name: Build and verify exact V0.7 place
        shell: bash
        run: |
          set -euo pipefail
          place="$RUNNER_TEMP/after-school-city-v070.rbxl"
          "$ROJO_EXE" build 'asc-source/maps/after-school-city/default.project.json' -o "$place"
          test -f "$place"
          bytes=$(stat -c%s "$place")
          sha=$(sha256sum "$place" | awk '{print $1}')
          [[ "$bytes" == "$EXPECTED_BYTES" ]] || { echo "Byte mismatch: $bytes expected=$EXPECTED_BYTES"; exit 22; }
          [[ "$sha" == "$EXPECTED_SHA256" ]] || { echo "SHA256 mismatch: $sha expected=$EXPECTED_SHA256"; exit 23; }
          echo "PLACE_FILE=$place" >> "$GITHUB_ENV"
          echo "PLACE_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "PLACE_SHA256=$sha" >> "$GITHUB_ENV"
          echo "BUILD EXACT PASS bytes=$bytes sha256=$sha"

      - name: Publish School Interior v0.7 LIVE to Roblox
        shell: bash
        run: |
          set -euo pipefail
          url="https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published"
          http=$(curl -sS --location -o "$RUNNER_TEMP/asc-publish-response.json" -w '%{http_code}' -X POST "$url" -H "x-api-key: $ROBLOX_API_KEY" -H 'Content-Type: application/octet-stream' --data-binary "@$PLACE_FILE")
          body=$(cat "$RUNNER_TEMP/asc-publish-response.json")
          [[ "$http" =~ ^2[0-9][0-9]$ ]] || { echo "HTTP $http: $body"; exit 30; }
          version=$(jq -r '.versionNumber // empty' "$RUNNER_TEMP/asc-publish-response.json")
          [[ -n "$version" ]] || { echo "Missing versionNumber: $body"; exit 31; }
          echo "PUBLISHED_VERSION=$version" >> "$GITHUB_ENV"
          echo "ROBLOX PUBLISH PASS version=$version"

      - name: Persist LIVE receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          jq -n --arg status 'LIVE_PUBLISHED' --arg project 'AFTER SCHOOL CITY' --arg mode 'SCHOOL_INTERIOR_V0_7' --arg sourceRepo "$SOURCE_REPO" --arg sourceCommit "$SOURCE_SHA" --arg universeId "$UNIVERSE_ID" --arg placeId "$PLACE_ID" --arg versionNumber "$PUBLISHED_VERSION" --arg rojoVersion '7.7.0' --arg placeBytes "$PLACE_BYTES" --arg placeSha256 "$PLACE_SHA256" --arg runId "$GITHUB_RUN_ID" --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{status:$status,project:$project,mode:$mode,sourceRepo:$sourceRepo,sourceCommit:$sourceCommit,universeId:$universeId,placeId:$placeId,versionNumber:($versionNumber|tonumber),rojoVersion:$rojoVersion,placeBytes:($placeBytes|tonumber),placeSha256:$placeSha256,runId:$runId,publishedAt:$publishedAt,note:"School Interior v0.7 exact locked source; prior regression gates + School Interior Audit V1 passed; exact canonical QC build hash enforced; dedication intro preserved."}' > deploy-status/after-school-city-publish-school-interior-v0-7.json
          cat deploy-status/after-school-city-publish-school-interior-v0-7.json
          git config user.name 'After School City Publish Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/after-school-city-publish-school-interior-v0-7.json
          git commit -m "Record After School City School Interior publish v${PUBLISHED_VERSION} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
