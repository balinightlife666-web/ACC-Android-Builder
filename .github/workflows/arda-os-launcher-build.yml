name: Build ARDA OS Launcher

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'arda-os-launcher/**'
      - '.github/workflows/arda-os-launcher-build.yml'
  push:
    branches: [ main ]
    paths:
      - 'arda-os-launcher/**'
      - '.github/workflows/arda-os-launcher-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arda-os-launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ARDA-OS-Launcher-v0.2
          path: arda-os-launcher/app/build/outputs/apk/debug/app-debug.apk
