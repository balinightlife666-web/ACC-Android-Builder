name: BBYA Signing Probe

on:
  push:
    branches:
      - feat/bbya-music-manager-mvp

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore old BBYA signing cache
        id: old-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: bbya-music-debug-signing-v1
      - name: Print old signing fingerprint
        shell: bash
        run: |
          set -euo pipefail
          test -f "$HOME/.android/debug.keystore"
          keytool -exportcert -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android | sha256sum | awk '{print "OLD_CERT_SHA256=" $1}'
