name: BBYA Music Manager PR Build Once

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/bbya-music-manager/**'
      - '.github/workflows/bbya-music-manager-build.yml'
      - '.github/workflows/bbya-music-manager-pr-build-once.yml'

permissions:
  contents: read

concurrency:
  group: bbya-music-manager-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build BBYA Music Manager
        working-directory: tools/bbya-music-manager
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp tools/bbya-music-manager/app/build/outputs/apk/debug/app-debug.apk dist/BBYA-Music-Manager-v0.2-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BBYA-Music-Manager-v0.2-debug
          path: dist/BBYA-Music-Manager-v0.2-debug.apk
          if-no-files-found: error
          retention-days: 7
