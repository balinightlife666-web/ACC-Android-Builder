name: BBYA Funkot Track01 Recovery Retry

on:
  push:
    branches: [main]
    paths:
      - '.bbya-funkot-track01-retry'
      - '.github/workflows/bbya-funkot-track01-retry.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bbya-funkot-audio-cadangan-01
  cancel-in-progress: false

jobs:
  retry_once_with_receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AUDIO_KEY: ${{ secrets.ROBLOX_PUBLISH_CADANGAN_AUDII_01 }}
      SOURCE_TOKEN: ${{ secrets.ACC_ROBLOX_MAPS_WRITE_TOKEN || secrets.ACC_ROBLOX_MAPS_READ_TOKEN }}
      BBYA_UNIVERSE: '8116636513'
      TRACK_INDEX: '1'
      DRIVE_FILE_ID: '1ywtpqc6GsnQUTW4kJyHG76OVDnxEJ_i5'
      EXPECTED_UPLOADER_USERNAME: gudangpet88

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: ardarawk-cloud/ACC-Roblox-maps
          ref: main
          token: ${{ env.SOURCE_TOKEN }}
          path: source
          fetch-depth: 0

      - name: Verify rights gate and no existing canonical asset
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.confirmed == true and .driveFolderId == "1YB4xGNjTPk9f01D38NfQ4590DB8rBADS"' source/maps/bbya-social-hub/audio-rights-confirmation-funkot.json >/dev/null
          asset=$(jq -r '.tracks[]|select(.index==1)|.assetId // empty' source/maps/bbya-social-hub/audio-playlists/funkot.json)
          if [[ -n "$asset" ]]; then
            echo "CANONICAL_ASSET_ALREADY_EXISTS=$asset"
            exit 20
          fi
          echo RECOVERY_RETRY_GATE_PASS

      - name: Prepare source audio
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet gdown
          raw="$RUNNER_TEMP/bbya-funkot-track01.source"
          upload="$RUNNER_TEMP/bbya-funkot-track01.mp3"
          gdown "https://drive.google.com/uc?id=${DRIVE_FILE_ID}" -O "$raw"
          [[ -s "$raw" ]] || exit 30
          sha=$(sha256sum "$raw"|awk '{print $1}')
          codec=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$raw"|head -n1)
          if [[ "$codec" == mp3 ]]; then cp "$raw" "$upload"; else ffmpeg -y -hide_banner -loglevel error -i "$raw" -vn -ac 2 -ar 44100 -codec:a libmp3lame -b:a 192k "$upload"; fi
          echo "AUDIO_PATH=$upload" >> "$GITHUB_ENV"
          echo "SOURCE_SHA256=$sha" >> "$GITHUB_ENV"
          echo "SOURCE_SHA256=$sha"

      - name: Retry once and always capture injector report
        id: injector
        shell: bash
        working-directory: source
        env:
          MODERATION_WAIT_SECONDS: '0'
        run: |
          set +e
          python3 scripts/bbya-funkot-single-inject.py
          rc=$?
          set -e
          report="deploy-status/bbya-funkot-track01.json"
          if [[ -f "$report" ]]; then
            echo '--- INJECTOR REPORT ---'
            cat "$report"
            cp "$report" ../deploy-status/bbya-funkot-track01-retry.json
          else
            jq -n --arg status 'REPORT_MISSING' --arg rc "$rc" '{status:$status,exitCode:$rc}' > ../deploy-status/bbya-funkot-track01-retry.json
          fi
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist recovery receipt before any further action
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BBYA Funkot Track01 Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/bbya-funkot-track01-retry.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record BBYA Funkot Track01 retry receipt [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Persist canonical asset state only when asset ID exists
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          asset=$(jq -r '.tracks[]|select(.index==1)|.assetId // empty' maps/bbya-social-hub/audio-playlists/funkot.json)
          status=$(jq -r '.tracks[]|select(.index==1)|.status // empty' maps/bbya-social-hub/audio-playlists/funkot.json)
          if [[ -z "$asset" ]]; then
            echo "NO_ASSET_TO_PERSIST status=$status"
            exit 0
          fi
          git config user.name 'BBYA Funkot Track01 Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add maps/bbya-social-hub/audio-playlists/funkot.json maps/bbya-social-hub/audio-playlists/funkot-blacklist.json deploy-status/bbya-funkot-track01.json
          git commit -m 'Recover BBYA Funkot Track01 asset state [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final diagnostic gate
        shell: bash
        run: |
          status=$(jq -r '.status // empty' deploy-status/bbya-funkot-track01-retry.json)
          echo "TRACK01_RETRY_STATUS=$status"
          if [[ "$status" == HALTED_* ]]; then exit 1; fi
