name: After School City Publish Hosted V1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/after-school-city-publish-hosted-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: after-school-city-live-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_REPO: ardarawk-cloud/ACC-Roblox-maps
      SOURCE_SHA: d9b1cee118d5cfdb873b604991668a4f0a245428
      UNIVERSE_ID: '10745359869'
      PLACE_ID: '121603385909425'
      OLD_QUEUED_RUN_ID: '32973661693'
      ROBLOX_API_KEY: ${{ secrets.ROCKET_RACOON_PUBLISH }}

    steps:
      - name: Checkout publisher repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cancel obsolete self-hosted queued publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/cancel.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${OLD_QUEUED_RUN_ID}/cancel")
          echo "Cancel old queued run HTTP $code"
          if [[ "$code" != '202' && "$code" != '409' ]]; then
            cat /tmp/cancel.json || true
            exit 1
          fi

      - name: Checkout locked After School City source
        uses: actions/checkout@v4
        with:
          repository: ardarawk-cloud/ACC-Roblox-maps
          ref: d9b1cee118d5cfdb873b604991668a4f0a245428
          token: ${{ secrets.ACC_ROBLOX_MAPS_WRITE_TOKEN }}
          path: asc-source
          fetch-depth: 1

      - name: Preflight exact target and blockout source
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ROBLOX_API_KEY:-}" ]] || { echo 'ROCKET_RACOON_PUBLISH missing'; exit 10; }
          actual=$(git -C asc-source rev-parse HEAD)
          [[ "$actual" == "$SOURCE_SHA" ]] || { echo "Source SHA mismatch: $actual"; exit 11; }
          world='asc-source/maps/after-school-city/after-school-city.world.server.lua'
          config='asc-source/maps/after-school-city/after-school-city.config.lua'
          project='asc-source/maps/after-school-city/default.project.json'
          jq -e . "$project" >/dev/null
          for token in AfterSchoolCity SchoolDistrict Downtown SkatePark Park Residential SportsField ASC_Blockout 'world scaffold v0.1'; do
            grep -Fq "$token" "$world" || { echo "Missing scaffold marker: $token"; exit 12; }
          done
          grep -Fq '10745359869' "$config"
          grep -Fq '121603385909425' "$config"
          echo "LOCK PASS source=$actual universe=$UNIVERSE_ID place=$PLACE_ID"

      - name: Prepare Rojo 7.7.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc-rojo"
          curl -fsSL 'https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip' -o "$RUNNER_TEMP/rojo.zip"
          unzip -q -o "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/asc-rojo"
          rojo=$(find "$RUNNER_TEMP/asc-rojo" -type f -name rojo | head -n1)
          [[ -n "$rojo" ]] || { echo 'Rojo binary missing'; exit 20; }
          chmod +x "$rojo"
          "$rojo" --version
          echo "ROJO_EXE=$rojo" >> "$GITHUB_ENV"

      - name: Build exact scaffold place
        shell: bash
        run: |
          set -euo pipefail
          place="$RUNNER_TEMP/after-school-city-scaffold-v1.rbxl"
          "$ROJO_EXE" build 'asc-source/maps/after-school-city/default.project.json' -o "$place"
          test -f "$place"
          bytes=$(stat -c%s "$place")
          (( bytes >= 1024 )) || { echo "Generated RBXL suspiciously small: $bytes"; exit 21; }
          sha=$(sha256sum "$place" | awk '{print $1}')
          echo "PLACE_FILE=$place" >> "$GITHUB_ENV"
          echo "PLACE_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "PLACE_SHA256=$sha" >> "$GITHUB_ENV"
          echo "BUILD PASS bytes=$bytes sha256=$sha"

      - name: Publish scaffold LIVE to Roblox
        shell: bash
        run: |
          set -euo pipefail
          url="https://apis.roblox.com/universes/v1/${UNIVERSE_ID}/places/${PLACE_ID}/versions?versionType=Published"
          http=$(curl -sS --location -o "$RUNNER_TEMP/asc-publish-response.json" -w '%{http_code}' \
            -X POST "$url" \
            -H "x-api-key: $ROBLOX_API_KEY" \
            -H 'Content-Type: application/octet-stream' \
            --data-binary "@$PLACE_FILE")
          body=$(cat "$RUNNER_TEMP/asc-publish-response.json")
          echo "Roblox publish HTTP $http"
          [[ "$http" =~ ^2[0-9][0-9]$ ]] || { echo "$body"; exit 30; }
          version=$(jq -r '.versionNumber // empty' "$RUNNER_TEMP/asc-publish-response.json")
          [[ -n "$version" ]] || { echo "Missing versionNumber: $body"; exit 31; }
          echo "PUBLISHED_VERSION=$version" >> "$GITHUB_ENV"
          echo "ROBLOX PUBLISH PASS version=$version"

      - name: Persist LIVE receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-status
          jq -n \
            --arg status 'LIVE_PUBLISHED' \
            --arg project 'AFTER SCHOOL CITY' \
            --arg mode 'SCAFFOLD_V1_EXPLICIT_OWNER_TEST' \
            --arg sourceRepo "$SOURCE_REPO" \
            --arg sourceCommit "$SOURCE_SHA" \
            --arg universeId "$UNIVERSE_ID" \
            --arg placeId "$PLACE_ID" \
            --arg versionNumber "$PUBLISHED_VERSION" \
            --arg rojoVersion '7.7.0' \
            --arg placeBytes "$PLACE_BYTES" \
            --arg placeSha256 "$PLACE_SHA256" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status:$status,project:$project,mode:$mode,sourceRepo:$sourceRepo,sourceCommit:$sourceCommit,universeId:$universeId,placeId:$placeId,versionNumber:($versionNumber|tonumber),rojoVersion:$rojoVersion,placeBytes:($placeBytes|tonumber),placeSha256:$placeSha256,runId:$runId,publishedAt:$publishedAt,note:"Owner explicitly requested publishing the current blockout to inspect the real live result."}' \
            > deploy-status/after-school-city-publish-scaffold-v1.json
          cat deploy-status/after-school-city-publish-scaffold-v1.json

          git config user.name 'After School City Publish Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add deploy-status/after-school-city-publish-scaffold-v1.json
          git commit -m "Record After School City scaffold publish v${PUBLISHED_VERSION} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Comment owner test issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 10,
              body: `PASS — AFTER SCHOOL CITY blockout is LIVE. Universe ${process.env.UNIVERSE_ID}, Place ${process.env.PLACE_ID}, source ${process.env.SOURCE_SHA}, Roblox version ${process.env.PUBLISHED_VERSION}.`
            })
