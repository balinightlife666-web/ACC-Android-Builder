workflows:
  offgrid-android-debug:
    name: OFFGRID Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      vars:
        GRADLE_VERSION: "9.5.0"
    scripts:
      - name: Prepare Android SDK
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/apps/offgrid"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Install pinned Gradle
        script: |
          set -euo pipefail
          mkdir -p "$HOME/.offgrid-tools"
          if [ ! -x "$HOME/.offgrid-tools/gradle-${GRADLE_VERSION}/bin/gradle" ]; then
            curl -fL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/offgrid-gradle.zip
            rm -rf "$HOME/.offgrid-tools/gradle-${GRADLE_VERSION}"
            unzip -q /tmp/offgrid-gradle.zip -d "$HOME/.offgrid-tools"
          fi
          "$HOME/.offgrid-tools/gradle-${GRADLE_VERSION}/bin/gradle" --version
      - name: Build OFFGRID APK
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/apps/offgrid"
          "$HOME/.offgrid-tools/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/OFFGRID-v0.0.1-phase0.apk
    artifacts:
      - apps/offgrid/app/build/outputs/apk/debug/OFFGRID-v0.0.1-phase0.apk
